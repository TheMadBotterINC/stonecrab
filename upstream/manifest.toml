[inventory.umas.operations]
read = "Yes. onRead of symbolic variables; temporal types are hand-parsed (STRING, TIME, DATE, TOD, DATE_AND_TIME explicitly handled)."
write = "Yes. onWrite via serializeForType for every UmasDataType case, including TIME, DATE, TOD and DATE_AND_TIME."
subscribe = "Polling emulation only: UmasConnection extends PollingSubscriptionConnectionBase. UmasDriver does not override canSubscribe."
browse = "Yes. onBrowse/onBrowseWithInterceptor walk the data dictionary (BrowseTreeBuilder)."
discover = "Not implemented."
ping = "Yes. onPing sends UmasPDUPlcStatusRequest; failure maps to REMOTE_ERROR."

