notes = [
  """\
    Connection metadata (PlcConnection.getMetadata) is only four booleans: isReadSupported, isWriteSupported, isSubscribeSupported, isBrowseSupported. No ping or discovery flag. Driver metadata \
    (PlcDriver.getMetadata) is getDefaultTransportCode (Optional), getSupportedTransportCodes, getProtocolConfigurationOptionMetadata, getTransportConfigurationOptionMetadata(transportCode) and \
    isDiscoverySupported.""",
  "Option metadata (Option) has key, OptionType, description, isRequired, default value, since-version and isSecret (default false). Secret options must be masked in any rendering.",
  """\
    Connection identity: getProtocolCode, getProtocolName, getTransportCode, getTransportName default to 'unknown'. Lifecycle is connect() (checked PlcConnectionException), isConnected(), \
    close() (AutoCloseable, throws Exception). DefaultPlcDriverManager.getConnection(url) calls driver.getConnection(url) and then connection.connect(); driver.getConnection alone does not \
    connect.""",
  """\
    Driver registry: DefaultPlcDriverManager loads drivers with java.util.ServiceLoader<PlcDriver> and keys them by getProtocolCode; a duplicate code throws IllegalStateException. \
    getDriverForUrl parses the URL with java.net.URI and takes only getScheme() as the protocol code, so 's7:tcp://host' resolves to 's7'. A URISyntaxException becomes PlcConnectionException \
    'Invalid plc4j connection string'; an unknown code gives PlcConnectionException 'Unable to find driver for protocol'. Authentication overloads take PlcAuthentication: \
    PlcUsernamePasswordAuthentication (toString masks the password), PlcCertificateAuthentication (KeyStore, password char[] cloned, optional alias); PlcNullAuthentication also exists.""",
  """\
    Tag model: PlcTag has getAddressString(), getPlcValueType() (default NULL) and getArrayInfo() (default empty). ArrayInfo per dimension: getSize, getLowerBound, getUpperBound (both inclusive, \
    as written), getBase (declared lower bound, default 0), isRange. A bare index [6] is a scalar; a range [6..6] is an array of one. Single element versus range is decided by the written form, \
    not by equal bounds.""",
  """\
    PlcValueType (generated): NULL 0x00, BOOL 0x01, BYTE 0x02, WORD 0x03, DWORD 0x04, LWORD 0x05, USINT 0x11, UINT 0x12, UDINT 0x13, ULINT 0x14, SINT 0x21, INT 0x22, DINT 0x23, LINT 0x24, REAL \
    0x31, LREAL 0x32, CHAR 0x41, WCHAR 0x42, STRING 0x43, WSTRING 0x44, TIME 0x51, LTIME 0x52, DATE 0x53, LDATE 0x54, TIME_OF_DAY 0x55, LTIME_OF_DAY 0x56, DATE_AND_TIME 0x57, DATE_AND_LTIME \
    0x58, LDATE_AND_TIME 0x59, Struct 0x61, List 0x62, RAW_BYTE_ARRAY 0x71. The enum carries a default Java type (ULINT -> BigInteger, TIME -> Duration, WCHAR -> Short).""",
  """\
    PlcValue interface: getPlcValueType, getObject, isSimple/isNullable/isNull, is/isConvertibleTo/get(Class), isX/getX for boolean, byte, short, int (getInteger and getInt), long, BigInteger, \
    float, double, BigDecimal, String, Duration, LocalTime, LocalDate, LocalDateTime, getRaw() (byte[]), list access (isList, getLength, getIndex, getList), struct access (isStruct, getKeys, \
    hasKey, getValue(key), getStruct) and value metadata (getMetaDataNames, hasMetaData, getMetaData). Implementations are not in plc4j/api (they live in the values SPI module).""",
  """\
    PlcResponseCode: OK 0x01, NOT_FOUND 0x02, ACCESS_DENIED 0x03, INVALID_ADDRESS 0x04, INVALID_DATATYPE 0x06, INVALID_DATA 0x07, INTERNAL_ERROR 0x08, REMOTE_BUSY 0x09, REMOTE_ERROR 0x0A, \
    UNSUPPORTED 0x0B, RESPONSE_PENDING 0x0C, NOT_READY 0x0D, OUT_OF_RANGE 0x0E (0x05 unused). Errors are per tag (per query for browse), so a request can partly succeed.""",
  "Metadata keys at API level: PlcMetadataKeys.TIMESTAMP (Long), TIMESTAMP_SOURCE (TimeSource ASSUMPTION, SOFTWARE, HARDWARE, OTHER), RECEIVE_TIMESTAMP (Long), read via PlcTagResponse.getTagMetadata(name).",
  """\
    Connection-state events: ConnectionBase implements EventPlcConnection. Listeners that implement ConnectionStateListener receive PlcConnectionStateChangedEvent(changeType, details). \
    MessageExchangeListener (received/sending) is also declared. These are on EventPlcConnection, not on the PlcConnection interface.""",
  """\
    Exceptions: checked PlcException (PlcConnectionException, PlcProtocolException, PlcIoException; PlcUnsupportedProtocolException extends PlcConnectionException; PlcProtocolTimeoutException \
    and PlcProtocolPayloadTooBigException extend PlcProtocolException) and unchecked PlcRuntimeException (PlcUnsupportedOperationException, PlcNotImplementedException, PlcInvalidTagException, \
    PlcTimeoutException, PlcTagRangeException, PlcTagNotFoundException, PlcUnsupportedDataTypeException, PlcIncompatibleDatatypeException).""",
  "There is no timeout parameter anywhere in the request or connection interfaces. PlcTimeoutException exists but timeouts are configured per driver or transport.",
  "The site document design.adoc under plc4j/api/src/site was not used as evidence; everything here is from the Java sources.",
  "UNCERTAIN: PlcNullAuthentication was seen in the file list but not opened. The members of PlcProtocolPayloadTooBigException, PlcTagRangeException and similar were not read beyond the class declarations.",
  """\
    Capability lead (resolved): the API declares write, three subscription kinds with registered handles, browse, ping and (on the driver) discovery, but a connection does not necessarily \
    implement them. See spi_drivers: unsupported operations fail with a failed future, and real support is derived from overridden on* hooks.""",
]

[inventory.api.operations]
read = """\
  PlcConnection.readRequestBuilder() -> PlcReadRequest.Builder with addTagAddress(name, address) and addTag(name, PlcTag); execute() -> CompletableFuture<PlcReadResponse>. Response is keyed by \
  tag name: getResponseCode(name), getPlcValue(name), getAsPlcValue() (a PlcStruct of all tags, @Experimental), getNumberOfValues and typed getters with isValidX / getX(name[,index]) / \
  getAllXs(name). The interface javadoc promises PlcUnsupportedOperationException from the builder, but the SPI base class never throws it (see spi_drivers)."""
write = """\
  PlcConnection.writeRequestBuilder() -> PlcWriteRequest.Builder with addTagAddress(name, address, Object... values) and addTag(name, PlcTag, Object... values). Varargs are raw Java objects or \
  one PlcValue; several values mean an array write. The response carries only a PlcResponseCode per tag plus getTagMetadata."""
subscribe = """\
  PlcConnection.subscriptionRequestBuilder() -> PlcSubscriptionRequest.Builder. PlcSubscriptionType: CYCLIC 0x01, CHANGE_OF_STATE 0x02, EVENT 0x03. Builder methods \
  addCyclicTag/TagAddress(name, tag|address, Duration pollingInterval[, Consumer]); addChangeOfStateTag/TagAddress(name, tag|address[, Consumer][, Duration minInterval]); \
  addEventTag/TagAddress(name, tag|address[, Consumer]) (javadoc: signature provisional); setConsumer for the whole request. Response: getSubscriptionHandle(name), getSubscriptionHandles(). \
  Events are PlcSubscriptionEvent (a PlcReadResponse plus Instant getTimestamp()). PlcSubscriptionHandle.register(Consumer) returns a PlcConsumerRegistration (getConsumerId, \
  getSubscriptionHandles, unregister). Unsubscribe: unsubscriptionRequestBuilder().addHandles(...) -> PlcUnsubscriptionResponse with no per-handle result. Which kinds a driver implements is \
  driver-specific."""
browse = """\
  PlcConnection.browseRequestBuilder() -> PlcBrowseRequest.Builder with addQuery(name, queryString) (query syntax is driver-specific). execute() or \
  executeWithInterceptor(PlcBrowseRequestInterceptor): intercept(queryName, query, item) returns true to keep the item and lets callers see items while the browse runs. Response: \
  getQueryNames(), getResponseCode(queryName), getValues(queryName) -> List<PlcBrowseItem>. Item: getTag, getName, isReadable, isWritable, getSupportedSubscriptionTypes (empty means not \
  subscribable), isPublishable, isArray, getArrayInformation, getChildren (a tree), getOptions."""
discover = """\
  On PlcDriver, not PlcConnection: discoveryRequestBuilder() -> PlcDiscoveryRequest.Builder with addQuery(name, query); execute() or executeWithHandler(PlcDiscoveryItemHandler). Response \
  getResponseCode() and getValues(). PlcDiscoveryItem: protocol code, transport code, transport URL, options, name, attributes, connectionUrl. The PlcDriver default throws \
  PlcNotImplementedException and its default PlcDriverMetadata reports isDiscoverySupported=false."""
ping = """\
  PlcConnection.ping() returns CompletableFuture<PlcPingResponse> directly (no builder). PlcPingResponse carries one PlcResponseCode. There is no ping flag in PlcConnectionMetadata, so ping \
  support cannot be discovered through metadata."""

