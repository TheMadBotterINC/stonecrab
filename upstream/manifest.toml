notes = [
  """\
    CAPABILITY DECISION: DriverBase declares protected canDiscover/canBrowse/canPing/canRead/canWrite/canSubscribe (default false) and many drivers override them. Under plc4j only canDiscover() \
    is ever read (discoveryRequestBuilder and PlcDriverMetadata.isDiscoverySupported); the other five are declarations and overrides only (grep checked in S41). Real operation support is \
    whatever the connection class overrides. Example: ModbusTcpDriver does not override canSubscribe, yet ModbusTcpConnection extends PollingSubscriptionConnectionBase so its connection metadata \
    reports subscribe. Inventory each driver from its connection class hooks, not from can*.""",
  """\
    ConnectionBase.getMetadata() derives PlcConnectionMetadata by reflection: read if the connection class (or a superclass below ConnectionBase) declares onRead(PlcReadRequest); write -> \
    onWrite; subscribe -> onSubscribe; browse -> onBrowse or onBrowseWithInterceptor. A driver may override getMetadata when support depends on the remote device (S7 does). Ping and unsubscribe \
    are not covered.""",
  """\
    Unsupported operations fail asynchronously with PlcRuntimeException (a failed CompletableFuture), not with PlcUnsupportedOperationException from the builder as the API javadoc implies; the \
    builders are always available on ConnectionBase.""",
  """\
    Connection-string grammar (DriverBase.URI_PATTERN): ^(protocolCode [a-z0-9-]*)(:transportCode [a-z0-9-]*)?://(transportConfig [^?]*)(\\?paramString .*)?. The protocol code must equal the \
    driver's or PlcConnectionException 'This driver is not suited to handle this connection string'. If the transport code is omitted and the driver has no default transport: 'This driver has no \
    default transport and no transport code was provided.'""",
  """\
    Transport selection: the chosen transport must be in getMetadata().getSupportedTransportCodes() unless the option allow-unsupported-transport=true (default false), which bypasses only the \
    driver check, not the registered-transport lookup ('Unsupported transport <code>'). Transport config comes from parameters prefixed '<transportCode>.' (tcp.xxx, cotp.xxx), the audit log from \
    'log.' parameters (log.audit-log-file) and the protocol config from unprefixed parameters.""",
  """\
    Parameter parsing (ConfigurationFactory): split on '&' and the first '='; names match exactly (case-sensitive) against @ConfigurationParameter value (or the field name if blank); only the \
    first value of a repeated parameter is used; values are URL-decoded (UTF-8), names are not. Types: String, boolean (Boolean.parseBoolean, so anything but 'true' is false), byte, short, int, \
    long, float, double, java.io.File, enums (Enum.valueOf, exact name) or an @ParameterConverter. @ComplexConfigurationParameter nests a configuration under a prefix. Defaults come from \
    @BooleanDefaultValue, @IntDefaultValue, @LongDefaultValue, @ShortDefaultValue, @FloatDefaultValue, @DoubleDefaultValue, @StringDefaultValue. A @Required field without a value gives \
    IllegalArgumentException 'Missing required fields: [...]' (not a PlcConnectionException). The required-check for complex fields is a TODO in the source. Other annotations: @Description, \
    @Since, @Secret.""",
  """\
    Unknown connection-string parameters never fail the connection; UnknownParameterReporter logs a WARN per parameter with a 'did you mean' suggestion (same leaf name under another prefix wins, \
    otherwise an edit-distance budget of length/4 clamped to 1..3).""",
  """\
    Secret handling: DriverBase logs the connection string through ConnectionStringRedactor, which masks (******) every @Secret parameter of the driver and transport configurations, URI userinfo \
    passwords, nested connection strings in values and, as a backstop, any parameter whose name matches password|passwd|secret|token|psk-key|passphrase.""",
  """\
    Option metadata: DriverBase.getMetadata() walks the configuration class hierarchy for @ConfigurationParameter fields: boolean -> BOOLEAN; int/short -> INT; long -> LONG; float -> FLOAT; \
    double -> DOUBLE; String and enums -> STRING; File -> FILE; anything else -> STRUCT, with description, required, default, since and secret. Subclass fields win over superclass fields for the \
    same key.""",
  """\
    Timeouts: neither DriverBase nor ConnectionBase defines a request or connect timeout; all are options of individual drivers or transports. The only SPI-level concurrency control is \
    RequestThrottle (max in-flight requests, default getMaxConcurrentRequests() = 1, fair semaphore plus FIFO queue, adjustable at runtime).""",
  """\
    Receive loop: ConnectionBase.startReceiving uses AsyncTransportInstance listeners when the transport is async, otherwise a daemon thread that spins calling the data handler. MessageCodecBase \
    framing: calculateTotalMessageSize returns NEED_MORE_DATA (-1) or DESYNCHRONIZED (-2); on desync, or a length below the minimum header or above the transport receive capacity, it drops one \
    byte and retries.""",
  """\
    isConnected() defaults to false; connect() is final and calls onConnect() (default does nothing); close() stops receiving and audit-logs CLOSE. DriverBase hands the connection its \
    protocol/transport codes and names and the caller-supplied PlcAuthentication.""",
  """\
    Shared tag model: PlcTagHandler.parseTag/parseQuery. TagConfigParser parses an optional trailing '{key: value, ...}' block (numbers, quoted strings, true/false). ArrayNotationParser is the \
    single array grammar: dimension = '[' index ['..' index] [';' base] ']', repeated per dimension; comma-separated dimensions inside one bracket are also accepted ([1..2,3..4] equals \
    [1..2][3..4]). Ranges are inclusive ([0..7] is eight elements), a bare index is a scalar, ';base' is the declared lower bound (default 0; [4..7;1] is offsets 3..6), upper below lower is an \
    error, an index below base is an error. The expression sits before the ':TYPE' part of an address; the pre-1.0 forms address:TYPE[n] and address:TYPE:n are detected and reported with the \
    rewritten address. AddressConstraints(maxIndex, maxDimensions, onlyTrailingDimensionMayBeRange) lets a driver reject what its wire format cannot carry. render() produces the canonical form \
    and keeps one-element ranges as ranges.""",
  "PlcBrowseItemArrayInfo (API) and ArrayInfo differ: the browse one's getSize is upper minus lower without +1; ArrayInfo is inclusive.",
  """\
    Read-side behavior to match: DefaultPlcReadResponse.getPlcValue(name) returns null for an unknown tag but getResponseCode(name) throws PlcInvalidTagException; getAsPlcValue returns a \
    PlcStruct keyed by tag name; getTagMetadata is always empty. DefaultPlcWriteResponse.getResponseCode returns the stored code (null if absent). DefaultPlcConsumerRegistration ids come from a \
    process-wide AtomicInteger starting at 1.""",
  """\
    UNCERTAIN: a parameter given without '=' (for example '?foo') yields a null value in splitQueryParameter and then reaches URLDecoder.decode(null, UTF_8) when a field of that name exists; a \
    NullPointerException is expected but was not run.""",
  """\
    UNCERTAIN: DefaultPlcWriteResponse/ReadResponse typed getters beyond a sample, the remaining messages items, metadata/DefaultOption*.java, UnknownParameterReporter after line 120 and the \
    ConnectionStringRedactor imports were not opened. TransportInstance, DefaultTransportManager and AsyncTransportInstance live in the transports API and are described only by their use here.""",
  "UNCERTAIN: the DefaultPlcSubscriptionRequest.Builder 'no duplicate detection' claim is read from the code (plain tags.put); no test was consulted.",
]

