  """\
    Wire model: ModbusRtuADU = uint8 address, ModbusPDU, uint16 crc checksum (modbus.mspec, DriverType MODBUS_RTU 0x02). TCP, TLS, PSK-TLS and UDP are accepted as carriers for serial-to-IP \
