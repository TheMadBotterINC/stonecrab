[inventory.go_spi.transports]
default = "none at SPI level: each driver passes its own default transport code to NewDefaultDriver"
supported = ["tcp", "udp", "serial"]

[inventory.go_spi.operations]
read = "No SPI-level read. DefaultConnection.ReadRequestBuilder panics ('not provided by actual connection'); each driver's Connection overrides it. SingleItemRequestInterceptor can split a multi-tag read into one request per tag."
write = "Same pattern as read: DefaultConnection.WriteRequestBuilder panics unless the driver overrides it; the interceptor splits multi-tag writes the same way."
subscribe = """\
  No capability flag. DefaultConnection builders panic. Opt-in DefaultPollingSubscriber emulates CYCLIC and CHANGE_OF_STATE by periodic reads (default interval 1 s; EVENT answered UNSUPPORTED) with \
  per-consumer bounded delivery queues. Adopted by abeth, slmp and umas only; s7 and opcua implement their own native subscribers; modbus has none."""
browse = "DefaultBrowser runs a driver-supplied BrowseQuery once per query name with an optional interceptor and wraps it in a response; the builder itself panics unless the driver overrides it."
discover = """\
  PlcDriver.SupportsDiscovery() and Discover(ctx, callback, options...) live on the driver. DefaultDriver returns false and the error 'not available'. Overridden by ads, bacnetip, eip, knxnetip. \
  PlcDriverManager.Discover walks the selected drivers one after another and stops at the first error. Discovery options: protocol, transport, device name, local address, remote address, \
  protocol-specific key/value."""
ping = """\
  PlcConnection.Ping(ctx) error (no ping request/response objects). DefaultConnection.Ping only checks the local invalidated and connected flags and sends nothing; drivers override it (modbus and \
  s7 do a real round trip, opcua does not override)."""

