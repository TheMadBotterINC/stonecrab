[inventory.spi_drivers.operations]
read = """\
  ConnectionBase.read(PlcReadRequest) is final: it writes an API_REQUEST audit line when enabled and calls onRead, which by default returns a failed future with PlcRuntimeException('Read not \
  supported'). Read support is defined by a driver overriding onRead. DefaultPlcReadRequest.Builder rejects a duplicate tag name with PlcRuntimeException; an address the tag handler cannot \
  parse becomes a tag item carrying PlcResponseCode.INVALID_ADDRESS (logged at WARN), not an exception."""
write = """\
  ConnectionBase.write is final and calls onWrite, default failed future 'Write not supported'. DefaultPlcWriteRequest.Builder keeps tags in a TreeMap, so tag order is alphabetical by name. A \
  bad address gives INVALID_ADDRESS and a value the PlcValueHandler cannot build gives INVALID_DATA, both as per-tag error items. A single PlcValue argument passes through unchanged; raw \
  values go to PlcValueHandler.newPlcValue(tag, values)."""
subscribe = """\
  ConnectionBase.subscribe, unsubscribe, registerConsumer and unregisterConsumer are final and delegate to onSubscribe, onUnsubscribe, onRegisterConsumer, onUnregisterConsumer. Defaults: \
  failed future 'Subscribe not supported' / 'Unsubscribe not supported' and a thrown PlcRuntimeException for consumer (un)registration. DefaultPlcSubscriptionRequest.Builder parses addresses \
  eagerly (a bad address throws from the builder), does not detect duplicate names (a later put overwrites) and records the Duration for cyclic interval or change-of-state minInterval. \
  getSubscriptionHandles() returns each distinct handle once (identity). DefaultPlcSubscriptionEvent.getRequest() and getTag() return null."""
browse = """\
  ConnectionBase.browse is final (audit-logged); browseWithInterceptor is final but not audit-logged. They call onBrowse and onBrowseWithInterceptor, both defaulting to a failed future 'Browse \
  not supported'. DefaultPlcBrowseRequest.Builder.addQuery parses the query eagerly via PlcTagHandler.parseQuery. DefaultPlcBrowseItem makes the subscription type set an immutable EnumSet copy \
  (empty when null)."""
discover = """\
  DriverBase.discoveryRequestBuilder() returns a DefaultPlcDiscoveryRequest.Builder only when canDiscover() is true AND the driver itself implements PlcDiscoverer; otherwise it falls back to \
  PlcDriver's default and throws PlcNotImplementedException. PlcDiscoverer.discoverWithHandler defaults to plain discover(), ignoring the handler. PlcDriverMetadata.isDiscoverySupported() \
  returns canDiscover(). canDiscover is the only DriverBase can* method the SPI ever consults."""
ping = """\
  ConnectionBase.ping() builds a DefaultPlcPingRequest(this) and calls ping(request), which is final and audit-logged and calls onPing, default failed future PlcRuntimeException('Ping not \
  supported'). No metadata flag exists for ping."""

