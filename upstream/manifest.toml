notes = [
  "The operation set is narrow: browse, subscribe and discover only. The driver receives cyclic IO from configured devices; there is no acyclic read or write.",
  """\
    Connect flow: needs a raw-socket transport with a local IPv4 address; opens a pcap channel on that interface and a UDP datagram socket; runs LLDP/PN-DCP device discovery for each configured \
    device; each device then performs DCE/RPC Connect, parameter write (WriteParameters), ParameterEnd and ApplicationReady handshakes; waits up to 60 s for all devices to reach \
    ApplicationReady.""",
  """\
    Configuration: devices (device name, ip, device access, submodules, via ProfinetDeviceConvertor), gsddirectory, sendclockfactor 32, reductionratio 4, watchdogfactor 50, dataholdfactor 50. \
    Devices are described by GSDML files (gsdml package).""",
  """\
    Tag syntax: {address}[array]:TYPE where address matches [\\w\\-. ]+ and TYPE is a PlcValueType, for example foo.bar[0..3]:DINT. Named (symbolic) addressing; a selection must start at element \
    0. The type is not echoed back in getAddressString.""",
  "The raw-socket transport configuration pins UDP port 34964 as the default port.",
  "Both profinet and profinet-ng register the protocol code profinet (DRIVER_CODE = \"profinet\" in each), so they are alternatives, not coexisting drivers.",
  """\
    UNCERTAIN: the onRegisterConsumer gap was derived from the ConnectionBase defaults and the hook list of ProfinetConnection; the path used by ProfinetSubscriptionHandle.register (it calls \
    subscriber.registerConsumer with the connection) was not exercised. ProfinetDevice handshake details (lines 190-500, 640-900) were read for structure only.""",
]

