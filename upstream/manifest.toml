  "ASCII and RTU connection, driver and configuration classes are line-for-line copies apart from naming (diffed in S41; only comments differ in the connection).",
  "UNCERTAIN: the generated Constants values (MODBUSTCPDEFAULTPORT and the TLS and UDP ones) were not opened; 502 / 802 / UDP is assumed from the Modbus TCP inventory.",
