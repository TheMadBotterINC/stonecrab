ping = "Yes: canPing true, onPing"

# S41: PLC4J inventory at the same pinned commit (not a baseline change). Entries are grouped as
# api and spi, drivers, transports, tools, utilities, then pointers to material outside apache/plc4x.
# Every driver, transport and tool module under plc4j is inventoried (plc4j/drivers/all is only an
# aggregator pom; plc4j/utils/test-generator is Groovy only). In each entry the
# operations and transports tables come last, because a TOML sub-table header ends the entry's own keys.

[inventory.api]
title = "PLC4J API (plc4j/api): PlcConnection, PlcDriver, driver manager, request/response and value model"
kind = "api"
verified_against = "sparse checkout of commit ea229918f5d07700e04d7d69ab1645da679cb700 (tag v1.0.0), read 2026-10-28 for S41"
parity_record = "none yet (S43)"
scope = """\
  The public interfaces a PLC4J client programs against at v1.0.0. PlcConnection offers connect, isConnected, close, parseTagAddress, parseTagValue, getMetadata, ping() and five request \
  builders (read, write, subscription, unsubscription, browse). PlcDriver adds connection-string connect, prepareTag and discoveryRequestBuilder. Discovery lives on the driver, not the \
  connection. All requests execute asynchronously and return CompletableFuture. There is no pooled or timeout API here; PlcConnectionManager is only an AutoCloseable factory."""
connection_ops = { path = "plc4j/api/src/main/java/org/apache/plc4x/java/api/PlcConnection.java", lines = "35-143", note = """\
  Full PlcConnection interface: connect/isConnected/close, parseTagAddress, parseTagValue, getMetadata, ping, five request builders.""" }
