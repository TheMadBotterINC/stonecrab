[inventory.util_subscription_emulation.operations]
read = "Not provided; the extending driver must implement read."
write = "Not provided."
subscribe = """\
  POLLING. onSubscribe groups the request's tags by (subscription type, polling interval) into one EventPump TagBatch per group, started immediately, polling through an internal connection \
  wrapper that calls the driver's read. CYCLIC: the interval is the tag's Duration in ms when present and every poll fires an event. CHANGE_OF_STATE: the interval is always \
  getDefaultPollingInterval() (1000 ms, overridable); the minInterval given to addChangeOfStateTag* is ignored. A change-of-state event fires on the first successful poll and afterwards only \
  when PlcValue.getObject() differs (valuesEqual, overridable, plain Objects.equals). EVENT throws UnsupportedOperationException ('EVENT subscriptions are not supported with polling-based \
  subscriptions'), caught and returned as a failed future for the whole request, with no rollback of earlier groups. Tags in error responses are added to the event with their error code and a \
  null value, but an event is delivered only if at least one OK tag fired in that poll. Delivery order per event: request-level consumer, then each tag consumer for every tag in the event \
  (same event object), then registered consumers whose handles include this subscription. Handles are PollingSubscriptionHandle(subscriptionId, tagName), one per tag. Unsubscribe by handle \
  stops and removes the whole batch for that subscription id, so unsubscribing one tag ends its siblings; unknown handles only log a warning. registerConsumer ids come from the same counter as \
  subscription ids. close() closes the EventPump and clears all subscriptions and registrations before super.close()."""
browse = "Not provided."
ping = "Not provided; the internal wrapper delegates ping() to the real connection."

