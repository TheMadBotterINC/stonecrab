scope = """\
  The base classes every native PLC4J driver extends. DriverBase parses the connection string, picks and validates the transport, builds the protocol and transport configurations, creates the \
  audit log and asks the driver for a ConnectionBase. ConnectionBase maps the PlcConnection API onto protected on* hooks that default to a failed future. spi/config provides the \
  annotation-driven ConfigurationFactory. One driver (CtrlX) implements PlcDriver directly instead of extending DriverBase."""
