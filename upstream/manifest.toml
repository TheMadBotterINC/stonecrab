notes = [
  """\
  Security policies: six enum constants. NONE; Basic128Rsa15 (HMAC-SHA1, AES-CBC, SHA1withRSA, RSA PKCS1 v1.5); Basic256 (HMAC-SHA1, SHA1withRSA, RSA-OAEP SHA-1, AES key 32); Basic256Sha256 \
  (HMAC-SHA256, SHA256withRSA, RSA-OAEP SHA-1); Aes128_Sha256_RsaOaep (HMAC-SHA256, AES-128, SHA256withRSA, RSA-OAEP SHA-1); Aes256_Sha256_RsaPss (HMAC-SHA256, AES-256, SHA256withRSA/PSS via \
  BouncyCastle, RSA-OAEP SHA-256). Defaults are Basic256Sha256 with SIGN_ENCRYPT. No ECC policies. Only five policies actually secure anything.""",
  "Message security modes: NONE, SIGN, SIGN_ENCRYPT. The mode is ignored when the policy is NONE. The OPN exchange is always signed and encrypted for non-NONE policies.",
  """\
  Client certificate: PKCS12 key store by default (tls.keystore-type), first entry with a private key, RSA only, chain sent in SenderCertificate. With no key store a self-signed RSA \
  certificate is generated at connect (default 2048 bits, 25 years).""",
  "Trust: default is fail closed. Only tls.verify=false, tls.trust-store or server-certificate-file change that. Pinning is exact DER equality. Certificates learned over the unauthenticated discovery channel are never used as anchors.",
  """\
  Authentication: anonymous, username/password and X509 user certificate (via PlcCertificateAuthentication). No IssuedIdentityToken. Passwords go out encrypted with the user token policy's \
  algorithm; plaintext only if allow-insecure-credentials=true.""",
  """\
  Lifecycle: Hello/Acknowledge, OPN Issue, CreateSession, ActivateSession, renewal at 75 percent of the channel lifetime, CloseSession plus CloseSecureChannel on close. The renewal task is the \
  only periodic traffic besides Publish. No reconnect, no session re-activation and no TransferSubscriptions were found in the hand-written code.""",
  """\
  Timeouts: handshake-timeout-ms (60000) for Hello, OPN, CreateSession and close; request-timeout-ms (30000) for read, write, browse, subscribe calls and as default header timeoutHint; \
  session-timeout-ms (120000) requested then replaced by the server's revised value; channel-lifetime-ms (3600000) with min-channel-lifetime-ms (5000); CloseSession header timeout hard-coded \
  50000 ms; Publish timeoutHint 10x revised cycle.""",
  """\
  Wire details: all fields little-endian; ERR messages (OpcuaMessageError) are in the mspec but no hand-written code handles them (grep finds no reference), so a server ERR would surface as a \
  timeout. Sequence numbers must increase by exactly one; a gap fails the request.""",
  "Chunking is implemented for both directions: send splits by the negotiated send buffer; receive reassembles and enforces the negotiated max chunk count and max message size.",
  "Transports: only tcp (opc.tcp). The connection casts the transport instance to TcpTransportInstance. SecureChannel.INET_ADDRESS_PATTERN mentions http and https but that pattern is unused. No default port is defined in the driver.",
  "Subscriptions are native OPC UA, not subscription-emulation. One OPC UA subscription per PlcSubscriptionRequest.",
  "Tests (not behaviour evidence) exercise secure policies with server-certificate-file, e.g. OpcuaPlcDriverTest.java line 255.",
  """\
  Lead check (S41): 'Java: six security policies, browse, chunking, subscriptions' is confirmed. Six SecurityPolicy constants exist (SecurityPolicy.java 29-76), but one is NONE, so five give \
  real protection. Browse is implemented (opcua.browse.* keys, recursive with caps and BrowseNext). Chunking is implemented on send and receive; only the receive side enforces max chunk count \
  and message size. Subscriptions are native monitored items with a client-driven Publish loop (data change and events), with CYCLIC re-emitted client-side. Caveat: no reconnect, and non-NONE \
  policies appear to need server-certificate-file in practice (see the UNCERTAIN note).""",
  """\
  Lead check (S41): 'Go: partial' is confirmed from a cheap read of plc4go/internal/opcua only (the full Go inventory is S42, not done here). Go reports read, write and subscribe true and \
  browsing false (Connection.go 169-176); UnsubscriptionRequestBuilder returns nil with a TODO (Connection.go 204-207). Only 'None' and 'Basic256Sha256' are handled in the encryption code \
  (EncryptionHandler.go 127-130; SecureChannel.go 145-159). Any policy other than None is refused unless allow-unverified-security-policies=true, because the driver does not verify server \
  certificates or message signatures (Configuration.go 151-166). So Go is partial relative to Java: no browse, no unsubscribe, two policies, no verification. Not run; read from source only.""",
  """\
  UNCERTAIN: with discovery at its default true, a non-NONE policy and no server-certificate-file, Conversation.determineSecurityPolicy falls back to NONE and OpcuaConnection.onConnect then \
  throws. With discovery=false, ChunkFactory.create throws because no server certificate is available for the OPN. By reading, a non-NONE policy therefore needs server-certificate-file in \
  practice and tls.trust-store alone does not suffice. Not run, inferred from Conversation.java 554-562, OpcuaConnection.java 191-243 and ChunkFactory.java 75-79.""",
  "UNCERTAIN: DATE_AND_TIME writes the value's epoch seconds into the DateTime variant (OpcuaConnection.java 2337) while reads convert OPC ticks (1767-1774). This looks asymmetric but was not run, so whether it is a defect is unknown.",
  """\
  UNCERTAIN: Basic256/Basic128Rsa15 are listed in the enum, but whether they pass the repository's interop tests was not checked. Sequence-number wrap handling \
  (SecureChannelTransactionManager.java 53-59) was read but not analysed against the spec.""",
  """\
  Skipped: the generated readwrite package (only StaticHelper is hand-written there), src/test (grepped only for how options are combined), and about 15000 generated lines of service and type \
  definitions (opc-services, opc-types, opc-status, opc-attribute); only the opc-manual framing was read.""",
]

[inventory.opcua.transports]
default = "tcp"
supported = ["tcp"]

[inventory.opcua.operations]
read = """\
  Supported (canRead true). One ReadRequest for all tags of a request, maxAge 0, TimestampsToReturn both, attribute id from the tag (default Value), optional IndexRange. Per-tag status maps to \
  PlcResponseCode: BadNodeIdUnknown to NOT_FOUND, BadTypeMismatch to INVALID_DATATYPE, BadNotWritable and BadUserAccessDenied to ACCESS_DENIED, BadAttributeIdInvalid and BadIndexRangeNoData to \
  INVALID_ADDRESS, an undefined code to INTERNAL_ERROR, otherwise a fallback (UNSUPPORTED for reads, REMOTE_ERROR for writes). Custom structures are decoded to PlcStruct from the server's \
  DataTypeDefinition, or from the legacy binary type dictionary."""
write = """\
  Supported (canWrite true). One WriteRequest for all tags. The data type comes from the tag ;TYPE suffix, else from the server (DataType, ValueRank, ArrayDimensions, AccessLevel, cached per \
  session), else is inferred from the Java value. Writable types: BOOL, BYTE, WORD, DWORD, LWORD, USINT, SINT, UINT, INT, UDINT, DINT, ULINT, LINT, REAL, LREAL, CHAR/STRING/WCHAR/WSTRING (all \
  sent as OPC String), DATE_AND_TIME, TIME (sent as Int32 milliseconds). Any other type throws PlcRuntimeException 'Unsupported write tag type'. PlcStruct values are encoded back into a \
  custom-structure ExtensionObject."""
subscribe = """\
  Supported natively (canSubscribe true, onSubscribe overridden; the driver pom and sources reference no subscription-emulation). CreateSubscription, CreateMonitoredItems, then a client-driven \
  Publish loop. Data-change and event monitored items. CYCLIC tags are re-reported client-side from the last received value, because monitored items only notify on change. Unsubscribe works: \
  onUnsubscribe sends DeleteSubscriptions. No ModifySubscription, SetPublishingMode, Republish, TransferSubscriptions, ModifyMonitoredItems or DeleteMonitoredItems request is constructed \
  anywhere in the hand-written code."""
browse = """\
  Supported (canBrowse true, onBrowse and onBrowseWithInterceptor overridden). Recursive walk of forward HierarchicalReferences (i=33, subtypes included) from the query node. An empty query or \
  '**' starts at ns=0;i=85 (Objects folder). Follows BrowseNext continuation points. Variable children get DataType, ValueRank, ArrayDimensions and AccessLevel read in one batched Read, so \
  items carry a typed tag address, readable/writable flags and array shape. Bounded by browse-max-depth (64), browse-max-total-nodes (1000000) and browse-max-references-per-node (65536); 0 \
  means no limit."""
discover = """\
  Not supported as a PLC4X discovery operation (canDiscover is the DriverBase default false, driver is not a PlcDiscoverer). GetEndpoints is used only internally for endpoint selection and \
  server-certificate acquisition when the discovery option is on."""
ping = "Not supported (canPing is the DriverBase default false; ConnectionBase.onPing fails with 'Ping not supported' and OpcuaConnection does not override it)."

