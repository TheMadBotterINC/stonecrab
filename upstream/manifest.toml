  """\
    Connection strings: scheme selects the driver; 'driver:transport://host:port' (opaque form) selects a transport explicitly, otherwise the driver's default transport; query parameters are the \
    shared option map for transport and driver; a driver injects defaultTcpPort or defaultUdpPort into that map for the transport to pick up.""",
  """\
