  "Default group-address format is 3 levels in both (Go ConnectionHelper.go 169-178 vs manifest inventory.knxnetip config).",
  """\
    Read: group-address tags are served from a local value cache fed by incoming GroupValueWrite frames; on a miss a GroupValueRead is sent over the tunnel and the answer decoded with the tag's \
