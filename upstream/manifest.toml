    authentication, property and memory read internals are taken from function names and callers.""",
  "UNCERTAIN: whether the Java driver also serves device-level or cached reads is not known beyond the manifest's tag and read notes.",
  """\
    UNCERTAIN: KnxLayer selection by connection-type is passed to the ConnectionRequest (ConnectionInternalOperations.go line 99, grep only); BUSMONITOR frame handling was not read.""",
  """\
    UNCERTAIN: the group-address tag parsing treats a present datatype capture as set even when empty; whether that causes 'Unknown type' for untyped tags depends on GetSubgroupMatches \
    behaviour that was not read.""",
]

