mspec_memoryarea = { path = "protocols/s7/src/main/resources/protocols/s7/s7.mspec", lines = "959-975", note = "MemoryArea enum." }
notes = [
  """\
    Transport stack: S7Comm over COTP (ISO 8073) over TCP port 102 (ISO-on-TCP). Transport code cotp is the default and only supported one. Connect = COTP connection request with TSAPs derived \
    from rack/slot/device-group, then S7 SetupCommunication (pdu-size, max-amq-caller, max-amq-callee), then an SZL capability probe.""",
  """\
    Addressing parameters (S7CotpTransportConfiguration): local-rack 1, local-slot 1, local-device-group OTHERS, remote-rack 0, remote-slot 0, remote-device-group PG_OR_PC. Explicit local-tsap / \
    remote-tsap override the derived TSAP when non-zero. DeviceGroup: PG_OR_PC 0x01, OS 0x02, OTHERS 0x03.""",
  """\
    S7Configuration: pdu-size 1024, max-amq-caller 8, max-amq-callee 8, controller-type ANY, read-timeout-ms 10000, ha-heartbeat-interval-ms 4000, ha-failover-timeout-ms 2000. For \
    controller-type LOGO with the default pdu-size the context lowers the PDU size.""",
  """\
    PLC families: ControllerType ANY, S7_200, S7_300, S7_400, S7_1200, S7_1500, LOGO. Auto-detection reads SZL COMPONENT_IDENTIFICATION first, then MODULE_IDENTIFICATION, for the article number \
    and controller type. TransportSize in the mspec has per-family support flags for S7_300, S7_400, S7_1200, S7_1500, LOGO (S7_200 has no flag column).""",
  """\
    Address syntax: absolute, offset-based (Siemens style) with array notation and an explicit data type suffix. Forms: %{area}{sizeCode}{byteOffset}[.bit][array]:TYPE (areas I, Q, M, T, C, D \
    from MemoryArea); %DB{n}.DB{X|B|W|D}{offset}[.bit][array]:TYPE; short form %DB{n}:{offset}[.bit][array]:TYPE; fixed-length strings %DB..:STRING(n) or WSTRING(n); variable-length \
    STRING/WSTRING; a PLC-proxy form of ten hyphen-separated hex bytes; special tags ALM, QUERY:ALARM_S, QUERY:ALARM_8 (S7AlarmTag, value type Struct). BOOL requires a bit offset. Not symbolic: \
    no PLC symbol names.""",
  """\
    S7H: URL s7://hostA/hostB?... builds two inner S7CotpConnections with active-passive failover, heartbeat pings and one retry on transport failure. Read, write and browse are forwarded; \
    subscribe is hidden. This is a connection mode of the s7 driver, not its own protocol code.""",
  """\
    Discovery (S7PlcDiscoverer): a PN-DCP IdentifyAll on multicast MAC 01:0E:CF:00:00:00 over every non-loopback pcap interface (VLAN-tagged Ethernet), a fixed 10 s wait \
    (DEFAULT_DISCOVERY_TIMEOUT_MS), keeping only responses with vendor id 002A (Siemens) and a DCP device-type name starting S7- or LOGO. The class javadoc still mentions S7-1200 device ids \
    010D/010E, but the code filters by name prefix. Each hit is a discovery item with protocol s7, transport cotp and attributes ipAddress, subnetMask, macAddress, deviceTypeName, deviceName, \
    vendorId, deviceId, role. Devices with IP 0.0.0.0 use their MAC as the connection key.""",
  "Wire models live in protocols/s7/s7.mspec (S7Message, UserData items, DataItem, enums). Generated readwrite code was not used as evidence.",
  "UNCERTAIN: read/write detail beyond the entry points (multi-element BOOL, S7 error mapping, string handling) was only skimmed; onRead (about 571-760) and onWrite (about 764-1010) were not read in full.",
  "UNCERTAIN: S7Driver leaves canBrowse/canSubscribe at the DriverBase default (false), but the per-connection getMetadata() overrides what callers see, and no SPI code reads those flags.",
]

[inventory.s7.transports]
default = "cotp"
supported = ["cotp"]

[inventory.s7.operations]
read = "Native S7Comm ReadVar (S7CotpConnection.onRead); always reported supported. Requests go through an optimizer (S7Optimizer, S7BlockReadOptimizer) that chunks to the negotiated PDU size."
write = "Native S7Comm WriteVar (onWrite); always reported supported."
subscribe = """\
  NATIVE, not polling (no use of utils/subscription-emulation). Available only when the connect-time SZL probe succeeded, or when a pinned controller-type is S7_300, S7_400, S7_1200 or \
  S7_1500; otherwise subscribe returns UNSUPPORTED per request. Three kinds: (1) CYCLIC on a normal S7Tag via S7Comm UserData cyclic services (group 0x02): the PLC pushes values at an interval \
  (timebase x factor, minimum 100 ms, default 1 s, tags with equal interval share one PLC jobId); (2) EVENT on tag ALM: alarm push through UserData MsgSubscription (group 0x04, subfn 0x02); \
  (3) EVENT on QUERY:ALARM_S or QUERY:ALARM_8: a one-shot AlarmQuery (subfn 0x13) of currently buffered alarms, after which the handle is inert. Any other tag/type pair gives INVALID_ADDRESS \
  (so no CHANGE_OF_STATE). onUnsubscribe is implemented. On S7H dual-path connections subscribe is reported unsupported and is not re-established on failover."""
browse = """\
  Native but shallow, UserData-gated like subscribe (UNSUPPORTED per query when UserData is unavailable). Returns static memory areas plus a list of DB numbers from a UserData 'list blocks of \
  type DB' request; if that request fails only the static areas are returned. Not a symbolic tag browse."""
discover = "Supported via a PROFINET DCP IdentifyAll broadcast using pcap4j/libpcap (see notes). Needs the optional pcap runtime; without it the discovery future fails."
ping = "Supported (canPing true). No dedicated S7 ping: onPing sends a one-byte ReadVar on M0 and maps any failure to INTERNAL_ERROR."

