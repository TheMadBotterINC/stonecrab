read = "None. No onRead override; the ConnectionBase default fails with 'Read not supported'. The driver does not override canRead."
write = "None. No onWrite override ('Write not supported')."
subscribe = """\
  Native cyclic IO. onSubscribe maps each tag to a configured device (first dot-separated address segment, upper-cased) and creates a ProfinetSubscriptionHandle; an unknown device gives \
  INVALID_ADDRESS. ProfinetDevice dispatches parsed cyclic RT frames to registered consumers; CYCLIC, CHANGE_OF_STATE (compared to the last value) and EVENT are all handled in that dispatch. \
  However the connection class has no onRegisterConsumer override and the ConnectionBase default throws 'Register consumer not supported'; the working registerConsumer lives on ProfinetDevice, \
  so whether events can be consumed through the public API is doubtful."""
browse = "Supported (canBrowse true): onBrowse returns the tags of all configured devices via ProfinetDevice.browseTags, the same list for every query, code OK."
discover = "Supported: discoveryRequestBuilder opens pcap handles on all interfaces and runs ProfinetPlcDiscoverer (PN-DCP identify plus LLDP). Requires pcap."
ping = "None ('Ping not supported'); canPing not overridden."

