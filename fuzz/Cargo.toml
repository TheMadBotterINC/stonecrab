# Own Cargo workspace (ADR-0009): the root workspace lists `exclude = ["fuzz"]`, so the
# nightly-only, native-code fuzz dependencies never enter the root Cargo.lock or its
# cargo-deny, machete and package runs. Dependencies are declared here, not in the root
# [workspace.dependencies]; versions are minor-level caret ranges (section 15.4).
[package]
name = "stonecrab-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Fuzz targets for Stonecrab parsers (not published)"

[package.metadata]
cargo-fuzz = true

# No target derives structured input with `arbitrary` yet (fuzz_codec_bounded_reader reads
# its operation script from raw bytes), so it stays ignored until one does. cargo-machete
# scans this manifest too.
[package.metadata.cargo-machete]
ignored = ["arbitrary"]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1.5"
bytes = "1.10"
# The core contracts and the codec are always part of the crate; the features add the
# Modbus driver (with its transport), the OPC UA module and the sensor profile loader.
stonecrab = { path = "../crates/stonecrab", default-features = false, features = ["modbus", "opcua", "sensors"] }
# Later slices add path dependencies on the crate each new target exercises.

# Fuzz targets are added as [[bin]] sections by the slice that adds each target, named
# fuzz_<crate>_<parser> (see README.md).
[[bin]]
name = "fuzz_codec_bounded_reader"
path = "fuzz_targets/fuzz_codec_bounded_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_core_connection_string"
path = "fuzz_targets/fuzz_core_connection_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_address"
path = "fuzz_targets/fuzz_modbus_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_connection_string"
path = "fuzz_targets/fuzz_modbus_connection_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_mbap"
path = "fuzz_targets/fuzz_modbus_mbap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_ascii"
path = "fuzz_targets/fuzz_modbus_ascii.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_rtu"
path = "fuzz_targets/fuzz_modbus_rtu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_pdu"
path = "fuzz_targets/fuzz_modbus_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_opcua_address"
path = "fuzz_targets/fuzz_opcua_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_opcua_connection_string"
path = "fuzz_targets/fuzz_opcua_connection_string.rs"
test = false
