[package]
name = "stonecrab-transport"
version = "0.1.0"
description = "Deadline-bounded byte transports for Stonecrab drivers, with a Tokio TCP implementation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["tcp"]
# The TCP transport and its factory. Pulls Tokio's `net` feature only when enabled.
tcp = ["tokio/net"]

[dependencies]
stonecrab-core.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "io-util"] }

[dev-dependencies]
stonecrab-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "test-util", "rt-multi-thread"] }
