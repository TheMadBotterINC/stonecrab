[package]
name = "stonecrab-modbus"
version = "0.1.0"
description = "Native Modbus TCP driver for Stonecrab (alpha scope: read-only function codes 01 to 04)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []

[dependencies]
bytes.workspace = true
stonecrab-codec.workspace = true
stonecrab-core.workspace = true
stonecrab-transport.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
stonecrab-testkit = { workspace = true, features = ["fixtures", "net"] }
