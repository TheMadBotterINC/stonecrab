[package]
name = "stonecrab"
version = "0.2.0"
description = "Native Rust industrial protocol library: core contracts, Modbus TCP, an in-process simulator and sensor profiles in one crate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "docs/**", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# `cargo add stonecrab` gives the simulator, Modbus TCP and the sensor profiles. A constrained
# target turns them off with `default-features = false` and picks what it needs.
default = ["sim", "modbus", "sensors"]
# The three things most applications want, spelled out (the same set as the default).
full = ["sim", "modbus", "sensors"]
# Deadline-bounded byte transports and the Tokio TCP transport (`stonecrab::transport`).
transport = ["dep:tokio"]
# The native Modbus TCP driver (`stonecrab::modbus`). Needs the transport and the codec
# (the codec is always built).
modbus = ["transport", "dep:tracing"]
# The in-process simulator driver (`stonecrab::sim`).
sim = ["dep:tracing"]
# Declarative sensor profiles and their bounded TOML loader (`stonecrab::sensors`).
sensors = ["dep:serde", "dep:toml"]
# Deterministic contract fixtures for tests (`stonecrab::testkit`): fake clock and transport,
# scripted peers, the contract suite, the golden-vector loader. Off by default; not a runtime
# feature. It lives in this crate because a separate test crate that depends on `stonecrab`
# would be a dev-dependency cycle.
testkit = ["transport", "dep:serde", "dep:serde_json", "dep:toml", "tokio/macros"]

# Each example needs the driver it exercises, so a build without that feature skips it
# instead of failing; CI builds them all with --all-features.
[[example]]
name = "sim_read"
required-features = ["sim"]

[[example]]
name = "modbus_tcp_read"
required-features = ["modbus"]

[[example]]
name = "profile_read"
required-features = ["full"]

[dependencies]
thiserror.workspace = true
bytes.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "sync", "io-util"] }
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

# Test and example tooling only; never part of the packaged runtime graph.
[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "test-util", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
