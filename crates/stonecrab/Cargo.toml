[package]
name = "stonecrab"
version = "0.2.0"
description = "Public facade for the native Rust industrial protocol library Stonecrab"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []
# The in-process simulator driver, re-exported as `stonecrab::sim` (ARCHITECTURE.md section 10).
sim = ["dep:stonecrab-driver-sim"]

[dependencies]
stonecrab-core.workspace = true
stonecrab-driver-sim = { workspace = true, optional = true }

# Example and test tooling only (ADR-0014 addendum); never part of the packaged runtime graph.
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
