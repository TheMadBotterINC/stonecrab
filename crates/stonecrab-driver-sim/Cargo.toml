[package]
name = "stonecrab-driver-sim"
version = "0.1.0"
description = "In-process simulator driver for Stonecrab: the sanctioned test double for the driver boundary"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = []

[dependencies]
stonecrab-core.workspace = true
tracing.workspace = true

[dev-dependencies]
stonecrab-testkit.workspace = true
proptest.workspace = true
