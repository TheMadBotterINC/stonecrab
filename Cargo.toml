[workspace]
resolver = "3"
members = ["crates/stonecrab"]
exclude = ["fuzz", "tools/stonecrab-codegen"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["The Mad Botter INC"]
repository = "https://github.com/TheMadBotterINC/stonecrab"
keywords = ["plc", "industrial", "modbus", "sensors", "protocols"]
categories = ["network-programming", "embedded"]

[workspace.dependencies]
thiserror = { version = "2.0", default-features = false, features = ["std"] }
bytes = { version = "1.10", default-features = false, features = ["std"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false }
tokio = { version = "1.54", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
serial2 = { version = "0.2.39", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
serde = { version = "1.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = { version = "0.17", default-features = false }

[workspace.lints.rust]
unsafe_code                   = "forbid"
non_ascii_idents              = "deny"
rust_2018_idioms              = { level = "warn", priority = -1 }
rust_2024_compatibility       = { level = "warn", priority = -1 }
missing_docs                  = "warn"   # promoted to deny in published crates' lib.rs (§5.1)
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"
unused_import_braces          = "warn"
unused_lifetimes              = "warn"
single_use_lifetimes          = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
let_underscore_drop           = "warn"
macro_use_extern_crate        = "warn"
meta_variable_misuse          = "warn"
variant_size_differences      = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# denied even locally — never acceptable to run
unwrap_used                   = "deny"
expect_used                   = "deny"
panic                         = "deny"
unimplemented                 = "deny"
todo                          = "deny"
unreachable                   = "deny"
string_slice                  = "deny"
mem_forget                    = "deny"
exit                          = "deny"
dbg_macro                     = "deny"
print_stdout                  = "deny"
print_stderr                  = "deny"
use_debug                     = "deny"
allow_attributes              = "deny"
allow_attributes_without_reason = "deny"
map_err_ignore                = "deny"
mod_module_files              = "deny"

# restriction, warn — the first three are promoted to deny in lib.rs of the crates named in §5.1
indexing_slicing              = "warn"
arithmetic_side_effects       = "warn"
as_conversions                = "warn"
integer_division              = "warn"
float_cmp_const               = "warn"
lossy_float_literal           = "warn"
missing_assert_message        = "warn"
tests_outside_test_module     = "warn"
unwrap_in_result              = "warn"
let_underscore_must_use       = "warn"
let_underscore_untyped        = "warn"
clone_on_ref_ptr              = "warn"
rc_buffer                     = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method              = "warn"
wildcard_enum_match_arm       = "warn"
str_to_string                 = "warn"
string_add                    = "warn"
format_push_string            = "warn"
pub_without_shorthand         = "warn"
renamed_function_params       = "warn"
large_include_file            = "warn"

# nursery, individually
future_not_send               = "warn"
missing_const_for_fn          = "warn"
redundant_pub_crate           = "warn"
use_self                      = "warn"
needless_pass_by_ref_mut      = "warn"
iter_on_single_items          = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening   = "warn"
branches_sharing_code         = "warn"

# pedantic noise, allowed with reasons in §5.7
module_name_repetitions       = "allow"
must_use_candidate            = "allow"
similar_names                 = "allow"
too_many_lines                = "allow"
struct_excessive_bools        = "allow"

[workspace.lints.rustdoc]
all                       = { level = "warn", priority = -1 }
broken_intra_doc_links    = "deny"
private_intra_doc_links   = "deny"
bare_urls                 = "deny"

[profile.release]
lto             = "thin"
codegen-units   = 1
debug           = "line-tables-only"
overflow-checks = true

[profile.bench]
inherits = "release"
debug    = true
