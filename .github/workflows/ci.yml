name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:17 UTC. Runs every job below plus the "scheduled" skeleton.
    - cron: "17 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Notes on pinning. dtolnay/rust-toolchain is pinned to the commit behind its v1 tag
# (that repository has no immutable version tags; its 1.x.y refs are branches). The pin
# fixes the action code only: every use passes `toolchain:` explicitly, so the pin never
# selects the compiler. Tool versions match mise.toml (cargo-nextest 0.9.148, cargo-hack
# 0.6.45, cargo-machete 0.9.2, cargo-llvm-cov 0.9.1, cargo-deny 0.20.2, cargo-fuzz 0.13.2).
# The fuzz jobs use nightly-2026-10-01, also pinned in fuzz/rust-toolchain.toml
# (ADR-0009). `mise run <task>` runs the same commands locally; the mapping is at the
# top of mise.toml. Third-party actions
# (actions/checkout, upload-artifact, taiki-e/install-action) float on a major tag; the
# blocking semver job pins cargo-semver-checks 0.51.0 (ADR-0005, addendum S35).
jobs:
  test:
    env:
      # Proptest case count for CI (ADR-0009). The scheduled run also gets 256 because
      # this job runs on every trigger; local runs use the proptest default unless set.
      PROPTEST_CASES: 256
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.97.1", "1.99.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: ${{ matrix.rust }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo +${{ matrix.rust }} nextest run --locked --workspace --all-features --profile ci
      # nextest does not run doctests, so cargo test stays as the second step (ADR-0005).
      - run: cargo +${{ matrix.rust }} test --locked --workspace --all-features
      - run: cargo +${{ matrix.rust }} check --locked --workspace --no-default-features
  quality:
    env:
      PROPTEST_CASES: 256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
      # One instrumented nextest run, then a report pass per module (ADR-0005).
      - run: scripts/coverage-gate.sh
        env:
          NEXTEST_PROFILE: ci
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            target/coverage.lcov
            target/coverage-summary.txt
  cross:
    # ring (feature tls, ADR-0032) compiles C and assembly in its build script, so even a
    # cargo check of these targets needs their C cross compilers and C library headers; cc
    # finds Ubuntu's compilers by name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      - run: cargo check --locked --workspace --all-features --target aarch64-unknown-linux-gnu
      - run: cargo check --locked --workspace --all-features --target armv7-unknown-linux-gnueabihf
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - run: cargo package --locked -p stonecrab
        env:
          CARGO_HOME: ${{ runner.temp }}/stonecrab-package-home
      - run: |
          cargo package --locked -p stonecrab --list > target/package-files.txt
          diff -u packaging/stonecrab.txt target/package-files.txt
  dco:
    # Not meaningful on schedule or manual runs, and a new branch push has an all-zero
    # "before" and no base to compare with.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Signed-off-by on every pull request commit
        if: github.event_name == 'pull_request'
        run: scripts/dco-check.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Signed-off-by on every pushed commit
        if: github.event_name == 'push'
        run: |
          # After a force-push the old "before" commit is gone from the clone: skip then.
          if ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "::notice::before commit ${{ github.event.before }} is not in the clone; dco check skipped"
            exit 0
          fi
          scripts/dco-check.sh "${{ github.event.before }}..${{ github.sha }}"
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      # The powerset of the one crate's features (default, full, transport, modbus, sim,
      # sensors, opcua, testkit and the rest) at depth 2: every feature alone and every pair,
      # so each module builds with only the features it needs (modbus brings transport; opcua
      # and testkit bring transport). --no-dev-deps edits Cargo.toml while it runs, so this
      # pass cannot use --locked.
      - run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps
      # The crate without default features: the core contracts and the codec only.
      - run: cargo hack check --locked --workspace --no-default-features
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - run: cargo build --locked --examples --all-features
      - run: cargo run --locked -p stonecrab --example sim_read --features sim
      # profile_read against the in-process simulator, one step per synthetic sim profile; no
      # network. --expect-good fails the step on any measurement that is not of quality Good.
      - run: cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good
        env:
          STONECRAB_PROFILE: profiles/synthetic/sim/temperature_transmitter.toml
      - run: cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good
        env:
          STONECRAB_PROFILE: profiles/synthetic/sim/pressure_flow_level.toml
      - run: cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good
        env:
          STONECRAB_PROFILE: profiles/synthetic/sim/discrete_state.toml
  interop:
    # The driver against a real server: pymodbus 3.8.6 in Docker, built from
    # interop/pymodbus/ (ADR-0015 decision 16). Every push and pull request on
    # ubuntu-latest only, so the job can become a required check. The steps are the
    # subcommands of interop/pymodbus/interop.sh, which `mise run interop` also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/pymodbus/Dockerfile -t stonecrab-interop:local .
      - run: interop/pymodbus/interop.sh build
      # docker run -d on 127.0.0.1:5020
      - run: interop/pymodbus/interop.sh start
      # Probe until 60 s have elapsed (a real Modbus read, see interop.sh).
      - run: interop/pymodbus/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features
      #   --run-ignored ignored-only -E 'binary(modbus_interop_pymodbus) & test(/^tests::interop_/)'
      # (nextest names a test by its module path, hence the tests:: prefix.) The step
      # fails when the filter does not select exactly EXPECTED_TESTS (in interop.sh) tests.
      - run: interop/pymodbus/interop.sh tests
      # cargo run --locked -p stonecrab --example modbus_tcp_read --features modbus
      - run: interop/pymodbus/interop.sh example
      # cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good
      # once per profiles/synthetic/modbus-tcp/*.toml (three, counted), output in profiles.txt.
      - run: interop/pymodbus/interop.sh profiles
      # Image id, pip freeze and server log next to the contract report the test wrote.
      - run: interop/pymodbus/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-evidence
          path: target/interop-evidence/
      - run: interop/pymodbus/interop.sh stop
        if: ${{ always() }}
  interop-tls:
    # Modbus TCP over TLS (slice S71, ADR-0032): the driver's `modbus-tcp:tls` transport against
    # pymodbus 3.8.6 in its mutual-TLS mode (Python's ssl, that is OpenSSL), in the image of
    # interop/pymodbus/, with a PKI that openssl makes in that image at run time. No key is
    # committed or uploaded; the stop step removes the PKI. The steps are the subcommands of
    # interop/pymodbus/tls.sh, which `mise run interop-tls` (and `mise run interop`) also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/pymodbus/Dockerfile -t stonecrab-interop:local .
      - run: interop/pymodbus/tls.sh build
      # openssl in the image: an authority, a server and a client certificate, an unrelated
      # authority, copied out to target/interop-tls-pki/.
      - run: interop/pymodbus/tls.sh pki
      # docker create on 127.0.0.1:8802, docker cp the server's files in, docker start
      - run: interop/pymodbus/tls.sh start
      # Probe until 60 s have elapsed (a real Modbus read over mutual TLS, see tls.sh).
      - run: interop/pymodbus/tls.sh wait
      # cargo nextest run --locked -p stonecrab --all-features
      #   --run-ignored ignored-only -E 'binary(modbus_interop_tls) & test(/^tests::interop_tls_/)'
      # The step fails when the filter does not select exactly EXPECTED_TESTS (in tls.sh) tests.
      - run: interop/pymodbus/tls.sh tests
      # Image id, the server certificate's summary and the server log (never a key).
      - run: interop/pymodbus/tls.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-tls-evidence
          path: target/interop-evidence/tls/
      - run: interop/pymodbus/tls.sh stop
        if: ${{ always() }}
  interop-libmodbus:
    # The driver against a second, independent server: libmodbus 3.1.11's unit-test-server, a
    # C stack, in Docker, built from interop/libmodbus/ on a Debian trixie image pinned by
    # digest (slice S52a). Its own job so that a failure of either peer does not hide the
    # other's result. The steps are the subcommands of interop/libmodbus/interop.sh, which
    # `mise run interop-libmodbus` also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/libmodbus/Dockerfile -t stonecrab-interop-libmodbus:local .
      - run: interop/libmodbus/interop.sh build
      # docker run -d on 127.0.0.1:1502
      - run: interop/libmodbus/interop.sh start
      # Probe until 60 s have elapsed (a real Modbus read, see interop.sh).
      - run: interop/libmodbus/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_libmodbus) & test(/^tests::interop_/)' --test-threads 1
      # The server serves one connection at a time, hence one test at a time. The step fails
      # when the filter does not select exactly EXPECTED_TESTS (in interop.sh) tests.
      - run: interop/libmodbus/interop.sh tests
      # Image id, package version and server log next to the test output.
      - run: interop/libmodbus/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-libmodbus-evidence
          path: target/interop-evidence/libmodbus/
      - run: interop/libmodbus/interop.sh stop
        if: ${{ always() }}
  interop-opcua:
    # The OPC UA peer: open62541 v1.5.9 in Docker, built from the source at the pinned tag
    # commit with its OpenSSL backend on a Debian trixie image pinned by digest (slice S81).
    # Its server (interop/open62541/main.c) serves a test namespace under policies None,
    # Basic256Sha256, Aes128Sha256RsaOaep and Aes256Sha256RsaPss with anonymous, user name and
    # X.509 identities; its PKI is made at run time inside the container and never stored. No
    # Stonecrab OPC UA code exists yet: the job runs open62541's own client from the image
    # against it (slice S90 adds the driver's tests). Its own job, apart from the TCP peers
    # and not part of `mise run interop`. The steps are the subcommands of
    # interop/open62541/interop.sh, which `mise run interop-opcua` also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker build -f interop/open62541/Dockerfile -t stonecrab-interop-open62541:local .
      # Fails if the v1.5.9 tag names any commit but the pinned one.
      - run: interop/open62541/interop.sh build
      # docker run -d on 127.0.0.1:4840, advertising 127.0.0.1:4840
      - run: interop/open62541/interop.sh start
      # Probe until 60 s have elapsed (a real OPC UA Hello, answered with an Acknowledge).
      - run: interop/open62541/interop.sh wait
      # docker run --rm <image> check: the in-image client against servers started there
      # (None and Basic256Sha256 SignAndEncrypt reads of the counter, a refusal with an empty
      # trust list, the other policies and identities, the facts of the README). Fails on
      # any check that does not hold.
      - run: interop/open62541/interop.sh check
      # The client side of the running container's PKI to target/interop-pki/open62541/
      # (never uploaded; `stop` removes it).
      - run: interop/open62541/interop.sh pki
      # Image id, versions, the check output and the server log; never a key.
      - run: interop/open62541/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-opcua-evidence
          path: target/interop-evidence/open62541/
      - run: interop/open62541/interop.sh stop
        if: ${{ always() }}
  interop-modbus-tk:
    # The driver against a scripted multi-unit server: modbus-tk 1.1.5 in Docker, a first-party
    # script built from interop/modbus-tk/ on the python:3.12-slim image pinned by digest (slice
    # S52c). It serves units 1, 2 and 247, each with its own map, and answers no other unit.
    # Its own job so that a failure of any peer does not hide another's result. The steps are
    # the subcommands of interop/modbus-tk/interop.sh, which `mise run interop-modbus-tk` also
    # runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/modbus-tk/Dockerfile -t stonecrab-interop-modbus-tk:local .
      - run: interop/modbus-tk/interop.sh build
      # docker run -d on 127.0.0.1:5030
      - run: interop/modbus-tk/interop.sh start
      # Probe until 60 s have elapsed (a real Modbus read, see interop.sh).
      - run: interop/modbus-tk/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_modbus_tk) & test(/^tests::interop_/)'
      # The step fails when the filter does not select exactly EXPECTED_TESTS (in interop.sh)
      # tests.
      - run: interop/modbus-tk/interop.sh tests
      # Image id, pip freeze and server log next to the test output.
      - run: interop/modbus-tk/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-modbus-tk-evidence
          path: target/interop-evidence/modbus-tk/
      - run: interop/modbus-tk/interop.sh stop
        if: ${{ always() }}
  interop-toxiproxy:
    # The failure paths on a real clock (slice S52b): both peers behind Toxiproxy 2.13.0
    # (pinned by digest, API published on the loopback of the runner only), the tests adding
    # resets, black holes, latency, sliced frames and closed links, and pausing and killing the
    # pymodbus container, then tshark deciding whether the capture holds a malformed packet.
    # Its own job so that a failure here does not hide the result of the peers' plain runs. The
    # steps are the subcommands of interop/toxiproxy/interop.sh, which
    # `mise run interop-toxiproxy` also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # Builds the pymodbus and libmodbus images (their own interop.sh build), pulls
      # ghcr.io/shopify/toxiproxy:2.13.0 by digest and builds interop/toxiproxy/tshark/.
      - run: interop/toxiproxy/interop.sh build
      # A Docker network with the two peers and Toxiproxy; API and proxies on 127.0.0.1.
      - run: interop/toxiproxy/interop.sh start
      # Probe until 60 s have elapsed (a real Modbus read through each proxy, see interop.sh).
      - run: interop/toxiproxy/interop.sh wait
      # tshark in the network namespace of the Toxiproxy container, writing a pcap.
      - run: interop/toxiproxy/interop.sh capture
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_toxiproxy) & test(/^tests::interop_/)' --test-threads 1
      # The step fails when the filter does not select exactly EXPECTED_TESTS (in interop.sh)
      # tests.
      - run: interop/toxiproxy/interop.sh tests
      # Stops the capture and decodes it with tshark: fails on a malformed packet, a driver
      # request that is not one well-formed Modbus/TCP frame, or a leg without frames.
      - run: interop/toxiproxy/interop.sh check
        if: ${{ always() }}
      # Image digests, tshark and Toxiproxy versions, the capture counts and the container logs.
      - run: interop/toxiproxy/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-toxiproxy-evidence
          path: target/interop-evidence/toxiproxy/
      - run: interop/toxiproxy/interop.sh stop
        if: ${{ always() }}
  interop-udp:
    # Modbus TCP over UDP (modbus-tcp:udp) against an independent peer: diagslave 3.6, the free
    # Modbus slave simulator of proconX, as a Modbus UDP slave in Docker, built from
    # interop/diagslave/ on the Debian trixie image pinned by digest, with the diagslave archive
    # checked by SHA-256 (slice S61, ADR-0027). The tests put tc netem on the container's
    # interface for loss, delay, duplication and reordering, which Toxiproxy cannot do for UDP.
    # The steps are the subcommands of interop/diagslave/interop.sh, which
    # `mise run interop-udp` also runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # tc netem inside the container runs on the runner's kernel, which must have the sch_netem
      # module; load it first, so that a kernel without it fails here and not in a test.
      - run: sudo modprobe sch_netem
      # docker build -f interop/diagslave/Dockerfile -t stonecrab-interop-diagslave:local .
      # Fails on a diagslave archive whose SHA-256 is not the pinned one.
      - run: interop/diagslave/interop.sh build
      # docker run -d --cap-add NET_ADMIN on 127.0.0.1:1502/udp, then put a netem discipline on
      # the container's eth0 and remove it again, which fails when the kernel cannot do netem.
      - run: interop/diagslave/interop.sh start
      # Probe until 60 s have elapsed (a real Modbus read over UDP, see interop.sh).
      - run: interop/diagslave/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_diagslave) & test(/^tests::interop_/)' --test-threads 1
      # The netem discipline belongs to the container, hence one test at a time. The step fails
      # when the filter does not select exactly EXPECTED_TESTS (in interop.sh) tests.
      - run: interop/diagslave/interop.sh tests
      # Image id, base, archive checksum, iproute2 version and server log next to the test output.
      - run: interop/diagslave/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-udp-evidence
          path: target/interop-evidence/diagslave/
      - run: interop/diagslave/interop.sh stop
        if: ${{ always() }}
  interop-rtu:
    # Modbus RTU framing and CRC-16 (modbus-rtu:tcp, the stream of a serial-to-IP gateway)
    # against an independent peer: the diagslave 3.6 image of interop-udp run as Modbus RTU
    # over TCP ("diagslave -m enc -a 1"), serving unit 1 on 127.0.0.1:1503 in the container
    # stonecrab-interop-diagslave-rtu, so the two jobs never share a name or a port (slice
    # S59b, ADR-0024). The steps are the subcommands of interop/diagslave/interop.sh in its
    # enc mode, which `mise run interop-rtu` (and `mise run interop`) also runs. No tc, no
    # netem: nothing here needs a kernel module.
    runs-on: ubuntu-latest
    env:
      INTEROP_DIAGSLAVE_MODE: enc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/diagslave/Dockerfile -t stonecrab-interop-diagslave:local .
      # Fails on a diagslave archive whose SHA-256 is not the pinned one.
      - run: interop/diagslave/interop.sh build
      # docker run -d -p 127.0.0.1:1503:1503/tcp stonecrab-interop-diagslave:local enc
      - run: interop/diagslave/interop.sh start
      # Probe until 60 s have elapsed (a real FC03 read as an RTU frame with its CRC, see
      # interop.sh).
      - run: interop/diagslave/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_diagslave_rtu) & test(/^tests::interop_/)' --test-threads 1
      # The step fails when the filter does not select exactly EXPECTED_TESTS (in interop.sh)
      # tests.
      - run: interop/diagslave/interop.sh tests
      # Image id, base, archive checksum, the command line diagslave ran with and the server log
      # next to the test output.
      - run: interop/diagslave/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-rtu-evidence
          path: target/interop-evidence/diagslave-rtu/
      - run: interop/diagslave/interop.sh stop
        if: ${{ always() }}
  interop-serial:
    # Modbus ASCII (framing and LRC) and Modbus RTU (framing and CRC-16) as diagslave 3.6 does
    # them on a serial device, against the drivers' tcp gateway carrier (slice S60b, ADR-0024).
    # The diagslave image of interop-udp runs "diagslave -m ascii -a 1" (job interop-ascii) or
    # "diagslave -m rtu -a 1" (job interop-rtu-pty) on one end of a pseudo-terminal pair that
    # socat makes, and socat bridges the other end to a TCP port of the container
    # (stonecrab-interop-diagslave-ascii on 127.0.0.1:1504, stonecrab-interop-diagslave-rtu-pty
    # on 127.0.0.1:1505), so no job shares a name or a port with another. The steps are the
    # subcommands of interop/diagslave/interop.sh in the mode of the entry, which
    # `mise run interop-ascii`, `mise run interop-rtu-pty` (and `mise run interop`) also run.
    # No tc, no netem, no kernel module.
    name: interop-${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ascii, rtu-pty]
    env:
      INTEROP_DIAGSLAVE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # docker build -f interop/diagslave/Dockerfile -t stonecrab-interop-diagslave:local .
      # Fails on a diagslave archive whose SHA-256 is not the pinned one, and on a trixie that
      # no longer has the pinned iproute2 and socat.
      - run: interop/diagslave/interop.sh build
      # docker run -d -p 127.0.0.1:<1504 or 1505>:1504/tcp stonecrab-interop-diagslave:local <mode>
      - run: interop/diagslave/interop.sh start
      # Probe until 60 s have elapsed (a real FC03 read as an ASCII frame with its LRC or an
      # RTU frame with its CRC, through the bridge, see interop.sh).
      - run: interop/diagslave/interop.sh wait
      # cargo nextest run --locked -p stonecrab --all-features --run-ignored ignored-only
      #   -E 'binary(modbus_interop_diagslave_ascii) & test(/^tests::interop_/)' --test-threads 1
      # (the rtu-pty entry runs binary(modbus_interop_diagslave_rtu) without the test of a unit
      # that is a closed connection with -m enc). The step fails when the filter does not select
      # exactly EXPECTED_TESTS (in interop.sh) tests.
      - run: interop/diagslave/interop.sh tests
      # Image id, base, archive checksum, the iproute2 and socat versions, the command lines
      # diagslave and socat ran with and the server log next to the test output.
      - run: interop/diagslave/interop.sh evidence
        if: ${{ always() }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-${{ matrix.mode }}-evidence
          path: target/interop-evidence/diagslave-${{ matrix.mode }}/
      - run: interop/diagslave/interop.sh stop
        if: ${{ always() }}
  interop-serial-port:
    # Modbus RTU and Modbus ASCII through the drivers' serial carrier against diagslave 3.6 on a
    # serial port (slice S59c, ADR-0024). socat makes a pseudo-terminal pair on the runner,
    # diagslave (the pinned archive, its static Linux binary, no container) opens one end as its
    # serial port, and the tests open the other end with modbus-rtu:///<dir>/ttyB and
    # modbus-ascii:///<dir>/ttyB, so the serial.* options, the silence before a request and the
    # reopen of a lost port meet an independent peer, which the gateway runs of interop-rtu,
    # interop-ascii and interop-rtu-pty cannot show. Each mode is one step of
    # interop/diagslave/serial.sh, which `mise run interop-serial-port` also runs. No Docker,
    # no tc, no kernel module.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # The runner's package index and Ubuntu's socat; the version it got goes into the evidence
      # (serial-evidence.txt, from dpkg-query) and into the log here.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends socat
          dpkg-query -W socat
      # Downloads https://www.modbusdriver.com/downloads/diagslave.tgz and fails, before it
      # unpacks anything, on an archive whose SHA-256 is not the one pinned in
      # interop/diagslave/Dockerfile and PROVENANCE.toml.
      - run: interop/diagslave/serial.sh fetch
      # start, wait (a real FC03 read through the second end of the pair), tests (the nine
      # interop_ tests of the RTU file without the closed-connection one, and the two of
      # modbus_interop_diagslave_serial: exactly 11 or the step fails), evidence, stop.
      - run: INTEROP_DIAGSLAVE_SERIAL_MODE=rtu interop/diagslave/serial.sh run
      # The same for ASCII (the nine tests of the ASCII file and the same two), also when the
      # RTU step failed.
      - run: INTEROP_DIAGSLAVE_SERIAL_MODE=ascii interop/diagslave/serial.sh run
        if: ${{ !cancelled() }}
      # The socat and diagslave versions and command lines, the connection strings, the logs
      # and the test output of each mode.
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: interop-serial-port-evidence
          path: |
            target/interop-evidence/diagslave-serial-rtu/
            target/interop-evidence/diagslave-serial-ascii/
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete
  lint-attrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint-attrs.sh
      - run: scripts/lint-attrs.sh --self-test
  parity:
    # ADR-0005 addendum (S31): every # Compatibility id in crates/*/src resolves to a row of
    # docs/parity, and every implemented or automated-verified row is referenced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/parity-check.sh
      - run: scripts/parity-check.sh --self-test
  beta:
    # Report only: a beta regression is information, not a merge blocker.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: beta
      - run: cargo +beta test --locked --workspace --all-features
  geiger:
    # cargo-geiger 0.14.0 builds on 1.99.1 but exits 1 whenever any dependency uses unsafe
    # (bytes does) and rejects a virtual workspace manifest, so it cannot gate first-party
    # code. The blocking gate is the grep; the geiger tree is an informational report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No first-party unsafe outside forbid(unsafe_code)
        run: |
          if grep -rnw --include='*.rs' unsafe crates tools fuzz | grep -v 'forbid(unsafe_code)'; then
            echo "first-party unsafe found; CODING_STANDARDS section 4 forbids it" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - name: Dependency unsafe report (informational)
        continue-on-error: true
        run: |
          cargo install cargo-geiger --version 0.14.0 --locked
          cargo geiger --locked --all-features --manifest-path "$PWD/crates/stonecrab/Cargo.toml"
  semver:
    # Blocking since S35. The baseline is the latest stonecrab on crates.io (0.3.0 since
    # 2026-10-29). An unchanged version in Cargo.toml is checked as a minor release, so a
    # breaking change fails until the version bump that announces it (CODING_STANDARDS 9.10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - run: cargo semver-checks -p stonecrab
  regen:
    # ADR-0019 decision 9 (slice S67): the generated code is exactly what the generator makes
    # from the vendored mspec files. scripts/regen.sh fetches once (the generator's crates,
    # the advisory database and the crates index) and runs everything else --frozen: the
    # generator workspace's fmt, clippy, tests and cargo deny, the vendored mspec sha256 of
    # upstream/manifest.toml, two byte-identical runs and a clean tree after an in-place run.
    # The two run steps are the commands of `mise run regen` (mise.toml); keep them in step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: scripts/regen.sh
      - run: scripts/regen.sh --self-test
  fuzz-smoke:
    # Also runs on workflow_dispatch. cargo-deny on the fuzz workspace comes first inside
    # the script; with zero targets the job is green (ADR-0009).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Nightly pinned by date in fuzz/rust-toolchain.toml; keep the two in sync.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: nightly-2026-10-01
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2
      - run: scripts/fuzz-smoke.sh
  scheduled:
    # Weekly evidence: the 30-minute fuzz run (S03b), the scoped mutation run of
    # mutants.toml (S32, ADR-0017; about 25 minutes with four jobs), the 10% benchmark gate
    # (S52, ADR-0009 addendum; about 20 minutes), the report-only branch coverage (S62,
    # ADR-0005 addendum) and an advisory dry run. The 8-hour fuzz run and the 24-hour soak
    # are maintainer runs (ADR-0017 addendum S62): they outlast a hosted job.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # The full history, so the benchmark step can check out the commit of a week ago.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: nightly-2026-10-01
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2,cargo-nextest@0.9.148,cargo-mutants@27.1.0,cargo-llvm-cov@0.9.1
      - name: Fuzz every target for 30 minutes (green with zero targets)
        run: scripts/fuzz-smoke.sh 1800
      # The stable toolchain for the mutation run; the fuzz step above needs the nightly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 tag, 2026-10-16
        with:
          toolchain: "1.99.1"
      - name: Mutation testing (mutants.toml scope; a survivor fails the step)
        run: scripts/mutants.sh 4
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: mutants-outcomes
          path: docs/evidence/mutants/outcomes.json
          if-no-files-found: ignore
      # Both trees are built and run on this one runner, alternately, so the comparison
      # carries no number from another machine. The base is the last commit that is at least
      # a week old; a base without benchmarks (before S52) is a notice, not a failure.
      - name: Benchmarks against last week's commit (fails on a >10% regression beyond noise)
        if: ${{ !cancelled() }}
        run: |
          base=$(git rev-list -n 1 --before="7 days ago" HEAD)
          if [ -z "$base" ]; then
            echo "no commit older than a week; nothing to compare"
          else
            scripts/bench-compare.sh "$base"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: bench-compare
          path: |
            target/bench-compare/report.md
            target/bench-compare/report.json
          if-no-files-found: ignore
      # Report only (ADR-0005 addendum S62): branch coverage needs the nightly, which the
      # script takes from fuzz/rust-toolchain.toml; no number here can fail the job.
      - name: Branch coverage per component (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: scripts/branch-coverage.sh
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: branch-coverage
          path: |
            target/branch-coverage.txt
            target/branch-coverage.lcov
          if-no-files-found: ignore
      - name: Advisory dry run (report only)
        run: cargo update --dry-run 2>&1 | tail -40
