name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.97.1", "1.99.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} test --locked --workspace --all-features
      - run: cargo +${{ matrix.rust }} check --locked --workspace --no-default-features
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --locked --workspace --all-features --exclude-from-report stonecrab-testkit --fail-under-lines 100 --lcov --output-path target/coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage.lcov
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf
      - run: cargo check --locked --workspace --all-features --target aarch64-unknown-linux-gnu
      - run: cargo check --locked --workspace --all-features --target armv7-unknown-linux-gnueabihf
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo package --locked --workspace --exclude stonecrab-testkit
        env:
          CARGO_HOME: ${{ runner.temp }}/stonecrab-package-home
      - run: |
          cargo package --locked -p stonecrab-core --list > target/core-package-files.txt
          diff -u packaging/stonecrab-core.txt target/core-package-files.txt
          cargo package --locked -p stonecrab --list > target/facade-package-files.txt
          diff -u packaging/stonecrab.txt target/facade-package-files.txt
