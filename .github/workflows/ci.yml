name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.97.1", "1.99.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked --workspace --all-features
      - run: cargo check --locked --workspace --no-default-features
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --workspace --all-features --fail-under-lines 100 --lcov --output-path target/coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage.lcov
