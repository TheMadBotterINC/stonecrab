[package]
name = "stonecrab-testkit"
version = "0.1.0"
description = "Unpublished deterministic contract fixtures for Stonecrab"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
stonecrab-core.workspace = true
bytes = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
stonecrab-transport = { path = "../../crates/stonecrab-transport", optional = true, default-features = false }

[features]
# The scripted network doubles: `Script`, `ScriptedPeer`, `FakeTransport` and
# `FakeTransportFactory`. Off by default so core's dev-dependency on this crate stays
# Tokio-free (ADR-0014, addendum). Pulls `stonecrab-transport`, which in turn has this
# crate as a dev-dependency (the same cycle shape as core, ADR-0003).
net = ["dep:bytes", "dep:tokio", "dep:stonecrab-transport"]
