# Own Cargo workspace (ADR-0019 decision 2, the layout of ADR-0009 for fuzz/): the root
# workspace lists this directory in `exclude`, so the generator's dependencies never enter
# the root Cargo.lock or the published crate's cargo-deny, machete and package runs. The
# tool uses the root rust-toolchain.toml (rustup finds it in a parent directory) and
# formats its output with that toolchain's rustfmt. Dependencies are limited to toml and
# sha2 (ADR-0019 decision 2; docs/DEPENDENCY_AUDIT.md).
[workspace]

[package]
name = "stonecrab-codegen"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
authors = ["The Mad Botter INC"]
repository = "https://github.com/TheMadBotterINC/stonecrab"
description = "Generates Stonecrab protocol codecs from Apache PLC4X MSpec descriptions (not published)"
readme = "README.md"
keywords = ["plc4x", "mspec", "codegen", "modbus"]
categories = ["development-tools"]

[dependencies]
# The same version and features as the root [workspace.dependencies] entry (audited for the
# crate); `parse` gives `toml::Table` from a string, the reader of upstream/manifest.toml
# and the protocol options.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
sha2 = { version = "0.11", default-features = false }

# The lint table of the root Cargo.toml (CODING_STANDARDS 5.1, 1.1: tools are first-party
# code). A workspace cannot inherit another workspace's [workspace.lints], so it is copied
# here; keep the two in step.
[lints.rust]
unsafe_code                   = "forbid"
non_ascii_idents              = "deny"
rust_2018_idioms              = { level = "warn", priority = -1 }
rust_2024_compatibility       = { level = "warn", priority = -1 }
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"
unused_import_braces          = "warn"
unused_lifetimes              = "warn"
single_use_lifetimes          = "warn"
trivial_casts                 = "warn"
trivial_numeric_casts         = "warn"
let_underscore_drop           = "warn"
macro_use_extern_crate        = "warn"
meta_variable_misuse          = "warn"
variant_size_differences      = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

unwrap_used                   = "deny"
expect_used                   = "deny"
panic                         = "deny"
unimplemented                 = "deny"
todo                          = "deny"
unreachable                   = "deny"
string_slice                  = "deny"
mem_forget                    = "deny"
exit                          = "deny"
dbg_macro                     = "deny"
print_stdout                  = "deny"
print_stderr                  = "deny"
use_debug                     = "deny"
allow_attributes              = "deny"
allow_attributes_without_reason = "deny"
map_err_ignore                = "deny"
mod_module_files              = "deny"

indexing_slicing              = "warn"
arithmetic_side_effects       = "warn"
as_conversions                = "warn"
integer_division              = "warn"
float_cmp_const               = "warn"
lossy_float_literal           = "warn"
missing_assert_message        = "warn"
tests_outside_test_module     = "warn"
unwrap_in_result              = "warn"
let_underscore_must_use       = "warn"
let_underscore_untyped        = "warn"
clone_on_ref_ptr              = "warn"
rc_buffer                     = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method              = "warn"
wildcard_enum_match_arm       = "warn"
str_to_string                 = "warn"
string_add                    = "warn"
format_push_string            = "warn"
pub_without_shorthand         = "warn"
renamed_function_params       = "warn"
large_include_file            = "warn"

future_not_send               = "warn"
missing_const_for_fn          = "warn"
redundant_pub_crate           = "warn"
use_self                      = "warn"
needless_pass_by_ref_mut      = "warn"
iter_on_single_items          = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening   = "warn"
branches_sharing_code         = "warn"

module_name_repetitions       = "allow"
must_use_candidate            = "allow"
similar_names                 = "allow"
too_many_lines                = "allow"
struct_excessive_bools        = "allow"
