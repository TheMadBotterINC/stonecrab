# Provenance of every fixture under fixtures/modbus (CODING_STANDARDS 13.6).
#
# Schema, enforced by stonecrab_testkit::load_dir (testkit feature `fixtures`):
#
#   [[vector]]  one per wire vector; the loader reads <name>.hex and the optional
#               <name>.expected.json next to this file, and fails when a .hex or
#               .expected.json file exists that no [[vector]] lists, or when a listed
#               vector has no .hex.
#     name      path of the vector relative to this file, no extension, "/" separated
#               (for example "tcp/read-input-registers-request")
#     source    "upstream_fixture" | "protocol_spec" | "captured" | "adversarial"
#     origin    upstream file path and revision, or the specification section
#     license   SPDX expression of the vector's own license
#     must_fail optional, default false; true when a decoder must reject the bytes
#     note      optional free text
#
#   [[file]]    one per non-vector first-party fixture
#     path      path relative to this file; must exist
#     origin    where the content was authored from
#     license   SPDX expression
#     note      optional free text
#
# The tcp/ directory holds Modbus PDU vectors (CODING_STANDARDS 13.6), PDU bytes only: no
# MBAP header and no unit identifier (those are the S22 framing vectors). Until maintainer
# prerequisite P4 (written approval to redistribute Apache PLC4X test vectors with NOTICE
# attribution) is granted, every vector is first-party: "protocol_spec" bytes written out
# from the examples of the Modbus Application Protocol Specification V1.1b, or "adversarial"
# bytes built to break the decoder. Nothing was copied from an upstream file. The PDF of
# the specification is not retained in this repository, so the section numbers are the
# published table of contents (docs/parity/modbus.md, UNVERIFIED) and the example bytes
# are transcribed from the published examples; a maintainer should check them against the
# PDF. When P4 is granted the upstream FC04 request and response vectors and the FC20 and
# FC21 must_fail vectors are added here with source "upstream_fixture".
#
# Every tcp vector has <name>.hex (comment lines, then one hex line) and a
# <name>.expected.json written by hand (or from the stated byte pattern), never produced
# by running the decoder. The expected files carry:
#   direction   "request" or "response": which decoder reads the bytes
#   function    the function code a response is decoded for
#   start, quantity       an accepted request
#   bytes, quantity, bits an accepted bit response (the packed bytes; bits are the first
#                         `quantity` bits, least significant bit first, optional)
#   registers             an accepted register response
#   exception             an accepted exception response: the exception code
#   error and, as the variant has them, field, value, needed, available, length, max,
#   remaining             a must_fail vector: the ParseError variant and its parameters

[[file]]
path = "interop/register-map.toml"
origin = "docs/parity/modbus.md, section \"Interop register map\" (rows MB-INTEROP-*) and decision D8"
license = "Apache-2.0"
note = "First-party. Read by the S25 contract fixture and the S27 pymodbus server generator through stonecrab_testkit::InteropMap. Nothing is copied from upstream's modbus_server.py."

