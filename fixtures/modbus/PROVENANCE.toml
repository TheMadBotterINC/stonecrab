[[vector]]
name = "tcp/adu_length-255-header-only"
source = "adversarial"
origin = "Authored to break the framer: MBAP length 255, one over the 254 bound (PDU at most 253 bytes, V1.1b section 4.1)"
license = "Apache-2.0"
must_fail = true
note = "FrameError::Oversized: length 255 declares a 261 byte ADU; rejected from the header alone, before any body is awaited"

[[vector]]
name = "tcp/adu_261-bytes-full"
source = "adversarial"
origin = "Authored to break the framer: a complete ADU of 261 bytes (254 byte PDU); the 260 byte maximum is exceeded even though every byte is present"
license = "Apache-2.0"
must_fail = true
note = "FrameError::Oversized: a complete 261 byte ADU is refused, not delivered"

[[vector]]
name = "tcp/adu_length-ffff-header-only"
source = "adversarial"
origin = "Authored to break the framer: MBAP length 0xFFFF, the largest the 16 bit field can hold"
license = "Apache-2.0"
must_fail = true
note = "FrameError::Oversized: length 65535 declares a 65541 byte ADU; rejected from the header alone"

[[vector]]
name = "tcp/adu_length-1"
source = "adversarial"
origin = "Authored to break the framer: MBAP length 1, below the smallest legal 2"
license = "Apache-2.0"
must_fail = true
note = "FrameError::Malformed: length 1 is a unit id with no PDU"

[[vector]]
name = "tcp/adu_length-0"
source = "adversarial"
origin = "Authored to break the framer: MBAP length 0"
license = "Apache-2.0"
must_fail = true
