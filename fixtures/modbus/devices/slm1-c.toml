# Documented map of the AutomationDirect SOLO Modular SLM1-C temperature controller (main
# unit, DC current output, universal input), a Modbus RTU and ASCII server on RS-485 (plan
# slice S52d, hardware record HW2).
#
# LABEL: documented map, not hardware-verified. Nothing here was read from a device. Every
# entry is transcribed from the vendor's manual, which is pinned by URL and sha256 in
# [source] and is not retained in this repository. The register tables are in chapter 7
# (printed pages 7-2 to 7-6). A value the manual does not state is marked
# basis = "placeholder": it only lets a replay tell one register from another and is not a
# claim about the device. docs/hardware/hw2-slm1-c.md lists what the hardware must settle.
#
# The device speaks RTU and ASCII only. Stonecrab has no RTU framing until slice S59, so the
# acceptance suite serves this map over Modbus TCP framing (the PDUs are the same bytes);
# that proves the PDU level and the profile, not the serial line.
#
# First-party, Apache-2.0 (the transcription is ours; the manual is not copied). Read by
# crates/stonecrab/tests/support/documented_map.rs, which rejects unknown keys. The shape
# is that of fixtures/modbus/devices/sio-mb04thms.toml; read its header for the keys.
#
# Conventions
#   number   the address the manual prints, in hexadecimal ("1000H"); a range such as
#            "1040H~1047H" is one entry of eight registers with one word each.
#   wire     the address a request carries: the manual's hexadecimal number as it is. The
#            appendix (pages A-2 to A-4) prints the Modbus decimal beside the hex for the
#            ramp/soak registers: 1040H is 44161 and 2000H is 48193, so the decimal is
#            40001 plus the hex, a one-based Modicon number, and the hex is the zero-based
#            wire address. A test checks the eight decimals this file transcribes.
#   basis    as in the SIO-MB04THMS file.

[device]
label = "documented map, not hardware-verified"
manufacturer = "AutomationDirect"
model = "SOLO Modular SLM1-C"
scheme = "modbus-rtu"
unit_id = 1                  # Network Address 1071H, default 1
address_reading = "zero-based"
# The manual does not list function code 04 for the data registers, so the input registers
# do not mirror them. ("Function Code 1 & 2 read the same memory area" for the bit
# registers, so the discrete inputs are the coils, as in the other file.)
input_registers_mirror_holding = false

[source]
document = "SOLO Modular Temperature Controller User Manual, 1st Edition 07/2023 (SLM, 68 pages)"
url = "https://cdn.automationdirect.com/static/manuals/soloslm/soloslmman.pdf"
sha256 = "830b99162dfbab23ed87c1778428747e65ce658dbce48e76899d4b948295d7cc"
retrieved = "2026-10-28"
license = "vendor documentation (AutomationDirect), all rights reserved; pinned by URL and sha256, never copied"

# Chapter 7, "Registers": data registers take 03, 06 and 16 (a read of at most eight
# registers, a write of at most eight); bit registers take 01, 02 and 05. The manual states
# no limit on bits. Function codes 04 and 15 are not listed.
[limits]
functions = [1, 2, 3, 5, 6, 16]
read_registers = 8
write_registers = 8

# ---- Process variable error codes -----------------------------------------------------
# "The read values below indicate the occurrence of errors" (register 1000H). 8005H is not
# listed.

[[sentinels]]
word = 0x8002
meaning = "Temperature not acquired yet"

[[sentinels]]
word = 0x8003
meaning = "Temperature sensor not connected"

[[sentinels]]
word = 0x8004
meaning = "Incorrect sensor type"

[[sentinels]]
word = 0x8006
meaning = "Unable to acquire temperature, ADC input error"

[[sentinels]]
word = 0x8007
meaning = "Unable to read/write the memory"

# ---- Bit registers --------------------------------------------------------------------
# The manual prints these five addresses after the register table, without an access
# column. They are single-bit flags, so the replay serves them as coils; whether the device
# does is an open item.

[[coils]]
number = "0811H"
wire = 0x0811
name = "Temperature unit display"
access = "R/W"
basis = "default"
value = true
meaning = "0 degrees F, 1 degrees C (default)."

[[coils]]
number = "0813H"
wire = 0x0813
name = "Read/write auto-tuning status"
access = "R/W"
basis = "default"
value = false
meaning = "0 end (default), 1 start."

[[coils]]
number = "0814H"
wire = 0x0814
name = "Run/Stop setting"
access = "R/W"
basis = "default"
value = true
meaning = "0 stop, 1 run (default)."

[[coils]]
number = "0815H"
wire = 0x0815
name = "Program stop flag"
access = "R/W"
basis = "placeholder"
value = false
meaning = "1 program stop."

[[coils]]
number = "0816H"
wire = 0x0816
name = "Program hold flag"
access = "R/W"
basis = "placeholder"
value = false
meaning = "1 program hold."

# ---- Data registers -------------------------------------------------------------------

[[registers]]
number = "1000H"
wire = 4096
name = "Process Variable (PV)"
type = "INT"
access = "R"
basis = "placeholder"
words = [0x00FA]
value = "250"
meaning = "Unit 0.1 degree (analog input: 1 EU). The values 8002H, 8003H, 8004H, 8006H and 8007H are error codes, not temperatures (see [[sentinels]]). The replay value 250 is 25.0 degrees. The manual does not say how a negative PV is stored."

[[registers]]
number = "1001H"
wire = 4097
name = "Set point (SV)"
type = "INT"
access = "R/W"
basis = "default"
words = [0x0000]
value = "0"
meaning = "Unit 0.1 degree. Default 0."

[[registers]]
number = "1002H"
wire = 4098
name = "Upper-limit of temperature range"
type = "INT"
access = "R/W"
basis = "default"
words = [0x1770]
value = "6000"
meaning = "Unit 0.1 degree. Default 6,000. The content shall not be bigger than the range."

[[registers]]
number = "1003H"
wire = 4099
name = "Lower-limit of temperature range"
