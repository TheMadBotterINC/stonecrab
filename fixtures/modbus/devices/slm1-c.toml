meaning = "Unit 0.1 degree. Default -200. The content shall not be smaller than the range."

[[registers]]
number = "1004H"
wire = 4100
name = "Input type"
type = "UINT"
access = "R/W"
basis = "default"
words = [0x000C]
meaning = "0 TC K, 1 TC J, 2 TC T, 3 TC E, 4 TC N, 5 TC R, 6 TC S, 7 TC B, 8 TC L, 9 TC U, 10 TC TXK, 11 JPt100, 12 Pt100 (default), 13 0-5 V, 14 0-10 V, 15 0-20 mA, 16 4-20 mA, 17 0-50 mV. A thermocouple needs this written first."

[[registers]]
