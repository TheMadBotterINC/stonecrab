# Provenance of every fixture under fixtures/opcua/codec (CODING_STANDARDS 13.6).
#
# Schema: as fixtures/modbus/PROVENANCE.toml (stonecrab::testkit::load_dir, feature
# `testkit`): one [[vector]] per <name>.hex, with its <name>.expected.json beside it.
#
# These are the byte vectors of the hand-written built-in types of the OPC UA binary
# encoding (slice S85, crates/stonecrab/src/opcua/codec): String, ByteString, Guid,
# DateTime, StatusCode, NodeId in its six encodings, ExpandedNodeId, QualifiedName and
# LocalizedText. They are first-party: every byte was written out from the encoding rules of
# OPC UA Part 6 v1.05 (Mappings), "Built-in Types", by a script that shares no code with the
# decoder, and every expectation was written from the same rules. Nothing is copied from the
# Apache PLC4X suites or any other implementation. The "protocol_spec" vectors are valid
# encodings; the "adversarial" ones (must_fail) are cut off, over a limit or invalid, and the
# expected file names the ParseError variant the decoder must answer with. The one
# "adversarial" vector that is not must_fail is string/not-utf8-kept: a String of bytes that
# are not UTF-8 is kept as read, and its expected file lists the bytes.
#
# The Part 6 PDF is not retained in this repository, so the section numbers are those of the
# published table of contents and the worked examples (the Guid 72962B91-FA75-4AE6-8D28-
# B404DC7DAF63, the String of U+6C34 and "Boy", the four-byte NodeId ns=5;i=1025) are written
# from the published examples as the author remembers them: UNVERIFIED, a maintainer should
# check them against the PDF. The bytes follow from the rules in either case. The revision
# named in every origin is 1.05; the encoding of these built-in types is the same in 1.04, as
# the author remembers it (UNVERIFIED likewise).
#
# Expected files: "type" names the built-in; "error" (a must_fail vector) names the
# ParseError variant; "reencodes_as" (hex, no spaces) is the canonical form of a vector that
# the decoder accepts in a wider or flagged form, and is absent when re-encoding must give
# the input back. See crates/stonecrab/src/opcua/codec/vectors.rs for how each type's fields
# are written.

