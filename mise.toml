# Local task runner. CI (.github/workflows/ci.yml) runs the same commands; the mapping is:
#
#   mise run check         = CI "quality" fmt, clippy and doc steps + CI "test" steps on
#                            the pinned 1.99.1 (nextest, then cargo test for doctests,
#                            then the --no-default-features check)
#   mise run coverage      = CI "quality" coverage step (scripts/coverage-gate.sh)
#   mise run lint-attrs    = CI "lint-attrs" job
#   mise run parity        = CI "parity" job (scripts/parity-check.sh and its --self-test)
#   mise run regen         = CI "regen" job (scripts/regen.sh and its --self-test, ADR-0019
#                            decision 9: the generator workspace's own gates, the vendored
#                            mspec hashes, two identical generator runs and an unchanged tree)
#   mise run generate      = no CI job: rewrites the generated code of every protocol under
#                            tools/stonecrab-codegen/protocols/ in place (ADR-0019)
#   mise run features      = CI "features" job
#   mise run examples      = CI "examples" job
#   mise run interop       = CI "interop", "interop-libmodbus", "interop-modbus-tk",
#                            "interop-toxiproxy", "interop-rtu", "interop-ascii",
#                            "interop-rtu-pty" and "interop-tls" jobs (needs Docker;
#                            interop/pymodbus/interop.sh, then interop/libmodbus/interop.sh,
#                            interop/modbus-tk/interop.sh, interop/toxiproxy/interop.sh,
#                            interop/diagslave/interop.sh in its enc, ascii and rtu-pty modes and
#                            interop/pymodbus/tls.sh, evidence under target/interop-evidence/
#                            and its libmodbus/, modbus-tk/, toxiproxy/, diagslave-rtu/,
#                            diagslave-ascii/, diagslave-rtu-pty/ and tls/). The UDP peer is not part
#                            of it: it needs a
#                            Docker that forwards published UDP ports, which colima's default
#                            ssh forwarder does not.
#   mise run interop-libmodbus = CI "interop-libmodbus" job alone (slice S52a)
#   mise run interop-modbus-tk = CI "interop-modbus-tk" job alone (slice S52c)
#   mise run interop-toxiproxy = CI "interop-toxiproxy" job alone (slice S52b)
#   mise run interop-udp   = CI "interop-udp" job (slice S61; Docker must forward UDP: Docker
#                            Desktop, or colima with its grpc port forwarder)
#   mise run interop-rtu   = CI "interop-rtu" job alone (slice S59b)
#   mise run interop-ascii = CI "interop-ascii" job alone (slice S60b)
#   mise run interop-rtu-pty = CI "interop-rtu-pty" job alone (slice S60b)
#   mise run interop-tls   = CI "interop-tls" job alone (slice S71; pymodbus over mutual TLS)
#   mise run interop-serial-port = CI "interop-serial-port" job (slice S59c; Linux only: diagslave
#                            and socat on a pseudo-terminal pair of the host, the drivers' serial
#                            carrier; not part of `mise run interop`, which also runs on macOS)
#   mise run fuzz          = CI "fuzz-smoke" job (scripts/fuzz-smoke.sh; optional seconds argument)
#   mise run machete       = CI "machete" job
#   mise run dependencies  = CI "dependencies" job
#   mise run package       = CI "package" job
#   mise run dco -- RANGE  = CI "dco" job (RANGE defaults to origin/master..HEAD)
#   mise run semver        = CI "semver" job (cargo-semver-checks against the published
#                            stonecrab; blocking since S35)
#   mise run mutants       = the "scheduled" job's mutation step once it is enabled (it is a
#                            no-op there today; scripts/mutants.sh, mutants.toml, evidence
#                            under docs/evidence/mutants/, ADR-0017)
#   mise run bench         = the Criterion benches by hand, for a baseline or a local look
#                            (no CI job runs them alone; slice S52, ADR-0009 addendum;
#                            docs/evidence/benchmarks/)
#   mise run bench-compare -- BASE_REF
#                          = the "scheduled" job's 10% benchmark gate (scripts/bench-compare.sh)
#   mise run sbom          = the "release-evidence" workflow (workflow_dispatch only,
#                            scripts/sbom.sh, files under target/release-evidence/)
#
# CI selects the nextest `ci` profile, which only adds a JUnit file; `mise run check` uses
# the default profile. These CI jobs have no task: the 1.97.1 and OS cells of "test",
# "cross" (needs the foreign targets), "beta", "geiger" and "scheduled" (whose benchmark
# step is `mise run bench-compare`).
# ADR-0005 records the coverage and waiver decisions; ADR-0017 records the release
# process, and the pins of cargo-mutants, cargo-cyclonedx and cargo-release below.
# The release evidence runs of slice S62 (ADR-0017 addendum) have tasks of their own and
# no CI job: "mise run soak" (the 24-hour soak), "mise run fuzz-evidence" (the 8-hour
# fuzz run) and "mise run branch-coverage" (report only; its CI step is in the weekly
# "scheduled" job).

[tools]
rust = "1.99.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-release" = "1.1.7"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"

[tasks.check]
description = "Run local formatting, strict lint, tests and documentation gates"
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo nextest run --locked --workspace --all-features",
  "cargo test --locked --workspace --all-features",
  "RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps",
  "cargo check --locked --workspace --no-default-features",
]

[tasks.coverage]
description = "Per-component line coverage gate from one instrumented nextest run (ADR-0005); components are the module groups of the single crate"
run = "scripts/coverage-gate.sh"

[tasks.branch-coverage]
description = "Report-only branch coverage per component from one instrumented nextest run on the fuzz workspace's pinned nightly, written to target/branch-coverage.txt (ADR-0005 addendum S62); the line gate of the coverage task is unchanged"
run = "scripts/branch-coverage.sh"

[tasks.lint-attrs]
description = "Fail on crate-level lint attributes outside the section 5.1 promotions"
run = "scripts/lint-attrs.sh"

[tasks.parity]
description = "Check that every # Compatibility id resolves in docs/parity and every implemented row is referenced (ADR-0005 addendum)"
run = [
  "scripts/parity-check.sh",
  "scripts/parity-check.sh --self-test",
]

[tasks.regen]
description = "The regen gate (ADR-0019 decision 9): fetch, then offline the generator workspace's fmt, clippy, tests and cargo deny, the vendored mspec sha256, two byte-identical generator runs and an unchanged tree, then the comparison's self-test"
run = [
  "scripts/regen.sh",
  "scripts/regen.sh --self-test",
]

[tasks.generate]
description = "Regenerate the code of every protocol under tools/stonecrab-codegen/protocols/ in place from the vendored mspec files (ADR-0019; review the diff, then commit it as a gen commit)"
run = "for options in tools/stonecrab-codegen/protocols/*.toml; do cargo run --locked --quiet --manifest-path tools/stonecrab-codegen/Cargo.toml -- generate \"$options\" || exit 1; done"

[tasks.features]
description = "Check the feature powerset (depth 2) of the single crate and the crate without default features"
run = [
  # --no-dev-deps rewrites Cargo.toml while it runs, which --locked refuses, so no --locked here.
  "cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps",
  "cargo hack check --locked --workspace --no-default-features",
]

[tasks.fuzz-evidence]
description = "The recorded release fuzz run: every fuzz target concurrently for SECONDS (default 1800; the release run is 28800, 8 hours), report in fuzz/target/evidence-logs/report.md (ADR-0017 addendum S62); e.g. mise run fuzz-evidence -- 28800"
run = "scripts/fuzz-evidence.sh"

[tasks.soak]
description = "The soak run: read continuously for SECONDS (default 86400, 24 hours) against sim or pymodbus, sample the resident memory, verdict on stability, report in target/soak/TARGET/ (ADR-0017 addendum S62); e.g. mise run soak -- pymodbus 86400"
run = "scripts/soak.sh"

[tasks.machete]
description = "Find unused dependencies"
run = "cargo machete"

[tasks.mutants]
description = "Recorded cargo-mutants run over the modules named in mutants.toml, outcomes.json copied to docs/evidence/mutants/ (ADR-0017; MUTANTS_JOBS sets the parallelism, default 4)"
run = "scripts/mutants.sh"

[tasks.bench]
description = "Run the Criterion benches (modbus_wire, modbus_loopback); arguments after -- go to Criterion, e.g. mise run bench -- --sample-size 20"
run = "cargo bench --locked -p stonecrab --all-features --bench modbus_wire --bench modbus_loopback --"

[tasks.bench-compare]
description = "The scheduled job's 10% gate: build BASE_REF and the working tree, run both in alternating rounds on this machine and fail on a regression beyond the noise band (ADR-0009 addendum S52)"
run = "scripts/bench-compare.sh"

[tasks.sbom]
description = "Write the CycloneDX SBOM of the one published crate and the archive file list to target/release-evidence/ (ADR-0017)"
run = "scripts/sbom.sh"

[tasks.dco]
description = "Require Signed-off-by on every commit in a range (default origin/master..HEAD)"
run = "scripts/dco-check.sh"

[tasks.semver]
description = "Check the public API against the published stonecrab with cargo-semver-checks (the blocking CI semver job; ADR-0005, addendum S35)"
run = "cargo semver-checks -p stonecrab"

[tasks.dependencies]
description = "Check dependency advisories, licenses, bans and sources"
run = "cargo deny --locked check"

[tasks.package]
description = "Verify the archive of the one published crate and compare shipped files with the reviewed list"
run = [
  "CARGO_HOME=$(mktemp -d) cargo package --locked -p stonecrab",
  "! cargo package --locked -p stonecrab --list 2>/dev/null | grep -E '(^|/)(fixtures|testdata)/'",
  "cargo package --locked -p stonecrab --list > target/package-files.txt",
  "diff -u packaging/stonecrab.txt target/package-files.txt",
]

[tasks.examples]
description = "Build every example with all features, run the sim example, then profile_read against each sim profile (ADR-0011)"
run = [
  "cargo build --locked --examples --all-features",
  "cargo run --locked -p stonecrab --example sim_read --features sim",
  "STONECRAB_PROFILE=profiles/synthetic/sim/temperature_transmitter.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
  "STONECRAB_PROFILE=profiles/synthetic/sim/pressure_flow_level.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
  "STONECRAB_PROFILE=profiles/synthetic/sim/discrete_state.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
]

[tasks.interop]
description = "The interop peers in Docker, one after the other: pymodbus (the interop tests, the modbus_tcp_read example and profile_read for each modbus-tcp profile), libmodbus (its tests), the modbus-tk multi-unit server (its unit-ID tests), then the failure paths of pymodbus and libmodbus behind Toxiproxy with a tshark decode, keeping the evidence of each (ADR-0015 decision 16, slices S52a, S52c and S52b), then Modbus RTU over TCP against diagslave (slice S59b), then Modbus ASCII and Modbus RTU on a pseudo-terminal bridged to TCP against diagslave (slice S60b), then Modbus TCP over mutual TLS against pymodbus (slice S71); the UDP peer of S61 is the separate interop-udp task"
run = [
  "interop/pymodbus/interop.sh run",
  "interop/libmodbus/interop.sh run",
  "interop/modbus-tk/interop.sh run",
  "interop/toxiproxy/interop.sh run",
  "INTEROP_DIAGSLAVE_MODE=enc interop/diagslave/interop.sh run",
  "INTEROP_DIAGSLAVE_MODE=ascii interop/diagslave/interop.sh run",
  "INTEROP_DIAGSLAVE_MODE=rtu-pty interop/diagslave/interop.sh run",
  "interop/pymodbus/tls.sh run",
]

[tasks.interop-libmodbus]
description = "Build and run the libmodbus 3.1.11 unit-test-server in Docker, run the libmodbus interop tests against it, keep the evidence in target/interop-evidence/libmodbus/ (slice S52a)"
run = "interop/libmodbus/interop.sh run"

[tasks.interop-modbus-tk]
description = "Build and run the first-party multi-unit modbus-tk 1.1.5 server in Docker, run the unit-ID interop tests against it, keep the evidence in target/interop-evidence/modbus-tk/ (slice S52c)"
run = "interop/modbus-tk/interop.sh run"

[tasks.interop-toxiproxy]
description = "Run pymodbus and libmodbus behind Toxiproxy 2.13.0 in Docker, run the failure-path interop tests (resets, black holes, latency, sliced frames, closed links, a paused and a killed peer) on a real clock, decode the capture with tshark, keep the evidence in target/interop-evidence/toxiproxy/ (slice S52b)"
run = "interop/toxiproxy/interop.sh run"

[tasks.interop-udp]
description = "Build and run diagslave 3.6 as a Modbus UDP slave in Docker, run the modbus-tcp:udp interop tests against it with tc netem loss, delay, duplication and reordering, keep the evidence in target/interop-evidence/diagslave/ (slice S61, ADR-0027)"
run = "interop/diagslave/interop.sh run"

[tasks.interop-rtu]
description = "Build and run diagslave 3.6 as a Modbus RTU over TCP slave (diagslave -m enc -a 1) in Docker, run the modbus-rtu:tcp interop tests against it (reads of each area, writes read back, the longest frames, an exception, a unit it does not serve, ping), keep the evidence in target/interop-evidence/diagslave-rtu/ (slice S59b, ADR-0024)"
run = "INTEROP_DIAGSLAVE_MODE=enc interop/diagslave/interop.sh run"

[tasks.interop-ascii]
description = "Build and run diagslave 3.6 as a Modbus ASCII slave (diagslave -m ascii -a 1) on a pseudo-terminal that socat bridges to a TCP port in Docker, run the modbus-ascii:tcp interop tests against it (reads of each area, writes read back, the longest frames, an exception, a unit it does not serve, ping), keep the evidence in target/interop-evidence/diagslave-ascii/ (slice S60b, ADR-0024)"
run = "INTEROP_DIAGSLAVE_MODE=ascii interop/diagslave/interop.sh run"

[tasks.interop-rtu-pty]
description = "Build and run diagslave 3.6 as a Modbus RTU slave (diagslave -m rtu -a 1) on a pseudo-terminal that socat bridges to a TCP port in Docker, run the modbus-rtu:tcp interop tests against it (the same tests as interop-rtu, with the silence diagslave answers a unit it does not serve with), keep the evidence in target/interop-evidence/diagslave-rtu-pty/ (slice S60b, ADR-0024)"
run = "INTEROP_DIAGSLAVE_MODE=rtu-pty interop/diagslave/interop.sh run"

[tasks.interop-tls]
description = "Build the pymodbus 3.8.6 image, make a throwaway PKI with openssl in it, run the server in its mutual-TLS mode in Docker, run the modbus-tcp:tls interop tests against it (reads, a write read back and ping, an untrusted server, a client without a certificate), keep the evidence (never a key) in target/interop-evidence/tls/ and remove the PKI (slice S71, ADR-0032)"
run = "interop/pymodbus/tls.sh run"

[tasks.interop-serial-port]
description = "Run diagslave 3.6 (the pinned archive, checked against its SHA-256, no container) as a Modbus RTU and then a Modbus ASCII slave on one end of a pseudo-terminal pair that socat makes on this Linux host, and run the modbus-rtu and modbus-ascii interop tests against the other end through the drivers' serial carrier, with the line silence and a lost port reopened, keeping the evidence in target/interop-evidence/diagslave-serial-rtu/ and diagslave-serial-ascii/ (slice S59c, ADR-0024)"
# Both modes always run, as in the CI job, where the ASCII step has `if: !cancelled()`.
run = "INTEROP_DIAGSLAVE_SERIAL_MODE=rtu interop/diagslave/serial.sh run; rtu=$?; INTEROP_DIAGSLAVE_SERIAL_MODE=ascii interop/diagslave/serial.sh run || exit 1; exit $rtu"

[tasks.fuzz]
description = "cargo deny on the fuzz workspace, then every fuzz target for 60 s (ADR-0009)"
run = "scripts/fuzz-smoke.sh"
