# Local task runner. CI (.github/workflows/ci.yml) runs the same commands; the mapping is:
#
#   mise run check         = CI "quality" fmt, clippy and doc steps + CI "test" steps on
#                            the pinned 1.99.1 (nextest, then cargo test for doctests,
#                            then the --no-default-features check)
#   mise run coverage      = CI "quality" coverage step (scripts/coverage-gate.sh)
#   mise run lint-attrs    = CI "lint-attrs" job
#   mise run parity        = CI "parity" job (scripts/parity-check.sh and its --self-test)
#   mise run features      = CI "features" job
#   mise run examples      = CI "examples" job
#   mise run interop       = CI "interop" job (needs Docker; interop/pymodbus/interop.sh,
#                            evidence under target/interop-evidence/)
#   mise run fuzz          = CI "fuzz-smoke" job (scripts/fuzz-smoke.sh; optional seconds argument)
#   mise run machete       = CI "machete" job
#   mise run dependencies  = CI "dependencies" job
#   mise run package       = CI "package" job
#   mise run dco -- RANGE  = CI "dco" job (RANGE defaults to origin/master..HEAD)
#   mise run semver        = CI "semver" job (cargo-semver-checks against the published
#                            stonecrab; blocking since S35)
#   mise run mutants       = the "scheduled" job's mutation step once it is enabled (it is a
#                            no-op there today; scripts/mutants.sh, mutants.toml, evidence
#                            under docs/evidence/mutants/, ADR-0017)
#   mise run bench         = the Criterion benches by hand, for a baseline or a local look
#                            (no CI job runs them alone; slice S52, ADR-0009 addendum;
#                            docs/evidence/benchmarks/)
#   mise run bench-compare -- BASE_REF
#                          = the "scheduled" job's 10% benchmark gate (scripts/bench-compare.sh)
#   mise run sbom          = the "release-evidence" workflow (workflow_dispatch only,
#                            scripts/sbom.sh, files under target/release-evidence/)
#
# CI selects the nextest `ci` profile, which only adds a JUnit file; `mise run check` uses
# the default profile. These CI jobs have no task: the 1.97.1 and OS cells of "test",
# "cross" (needs the foreign targets), "beta", "geiger" and "scheduled" (whose benchmark
# step is `mise run bench-compare`).
# ADR-0005 records the coverage and waiver decisions; ADR-0017 records the release
# process, and the pins of cargo-mutants, cargo-cyclonedx and cargo-release below.
# scripts/fuzz-evidence.sh (the recorded 30-minute run of all fuzz targets) has no task.

[tools]
rust = "1.99.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-release" = "1.1.7"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"

[tasks.check]
description = "Run local formatting, strict lint, tests and documentation gates"
run = [
  "cargo fmt --all --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo nextest run --locked --workspace --all-features",
  "cargo test --locked --workspace --all-features",
  "RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps",
  "cargo check --locked --workspace --no-default-features",
]

[tasks.coverage]
description = "Per-component line coverage gate from one instrumented nextest run (ADR-0005); components are the module groups of the single crate"
run = "scripts/coverage-gate.sh"

[tasks.lint-attrs]
description = "Fail on crate-level lint attributes outside the section 5.1 promotions"
run = "scripts/lint-attrs.sh"

[tasks.parity]
description = "Check that every # Compatibility id resolves in docs/parity and every implemented row is referenced (ADR-0005 addendum)"
run = [
  "scripts/parity-check.sh",
  "scripts/parity-check.sh --self-test",
]

[tasks.features]
description = "Check the feature powerset (depth 2) of the single crate and the crate without default features"
run = [
  # --no-dev-deps rewrites Cargo.toml while it runs, which --locked refuses, so no --locked here.
  "cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps",
  "cargo hack check --locked --workspace --no-default-features",
]

[tasks.machete]
description = "Find unused dependencies"
run = "cargo machete"

[tasks.mutants]
description = "Recorded cargo-mutants run over the modules named in mutants.toml, outcomes.json copied to docs/evidence/mutants/ (ADR-0017; MUTANTS_JOBS sets the parallelism, default 4)"
run = "scripts/mutants.sh"

[tasks.bench]
description = "Run the Criterion benches (modbus_wire, modbus_loopback); arguments after -- go to Criterion, e.g. mise run bench -- --sample-size 20"
run = "cargo bench --locked -p stonecrab --all-features --bench modbus_wire --bench modbus_loopback --"

[tasks.bench-compare]
description = "The scheduled job's 10% gate: build BASE_REF and the working tree, run both in alternating rounds on this machine and fail on a regression beyond the noise band (ADR-0009 addendum S52)"
run = "scripts/bench-compare.sh"

[tasks.sbom]
description = "Write the CycloneDX SBOM of the one published crate and the archive file list to target/release-evidence/ (ADR-0017)"
run = "scripts/sbom.sh"

[tasks.dco]
description = "Require Signed-off-by on every commit in a range (default origin/master..HEAD)"
run = "scripts/dco-check.sh"

[tasks.semver]
description = "Check the public API against the published stonecrab with cargo-semver-checks (the blocking CI semver job; ADR-0005, addendum S35)"
run = "cargo semver-checks -p stonecrab"

[tasks.dependencies]
description = "Check dependency advisories, licenses, bans and sources"
run = "cargo deny --locked check"

[tasks.package]
description = "Verify the archive of the one published crate and compare shipped files with the reviewed list"
run = [
  "CARGO_HOME=$(mktemp -d) cargo package --locked -p stonecrab",
  "! cargo package --locked -p stonecrab --list 2>/dev/null | grep -E '(^|/)(fixtures|testdata)/'",
  "cargo package --locked -p stonecrab --list > target/package-files.txt",
  "diff -u packaging/stonecrab.txt target/package-files.txt",
]

[tasks.examples]
description = "Build every example with all features, run the sim example, then profile_read against each sim profile (ADR-0011)"
run = [
  "cargo build --locked --examples --all-features",
  "cargo run --locked -p stonecrab --example sim_read --features sim",
  "STONECRAB_PROFILE=profiles/synthetic/sim/temperature_transmitter.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
  "STONECRAB_PROFILE=profiles/synthetic/sim/pressure_flow_level.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
  "STONECRAB_PROFILE=profiles/synthetic/sim/discrete_state.toml cargo run --locked -p stonecrab --example profile_read --features full -- --expect-good",
]

[tasks.interop]
description = "Build and run the pymodbus server in Docker, run the interop tests, the modbus_tcp_read example and profile_read for each modbus-tcp profile against it, keep the evidence (ADR-0015 decision 16)"
run = "interop/pymodbus/interop.sh run"

[tasks.fuzz]
description = "cargo deny on the fuzz workspace, then every fuzz target for 60 s (ADR-0009)"
run = "scripts/fuzz-smoke.sh"
